# Shared ruff defaults for the khala monorepo (Python).
#
# CHECK-ONLY / ADD-ONLY: this file provides common defaults ONLY for Python
# subprojects that do NOT declare their own [tool.ruff]. Subprojects that DO
# (nexus: line-length 120; arbiter / probe: line-length 100) keep their own
# pyproject.toml config as authoritative — ruff uses the closest config to each
# file, so this root file is a no-op for them.
#
# Rule selection is intentionally minimal and, importantly, EXPLICIT. Ruff's
# *default* set is not a fixed target: 0.16 widened it to include I/B/S/UP/RUF/SIM
# and friends, which is why every subproject now pins its own `[tool.ruff.lint]
# select` instead of inheriting the default. Do NOT add new rule families anywhere
# without re-capturing the lint baseline; never run `ruff format` (check-only).
#
# This file selects all of `E`, which includes E501 (line-too-long). The subprojects
# deliberately select the narrower `E4`/`E7`/`E9` — adopting E501 across them costs
# 64 line rewrites and is a separate cleanup, not a side effect of turning lint on.

target-version = "py311"
line-length = 100

[lint]
# Default selection only (Pyflakes F + pycodestyle E). Listed explicitly so the
# shared baseline is obvious and stable across ruff version bumps.
select = ["E", "F"]
