<svg xmlns="http://www.w3.org/2000/svg" width="660" height="352" viewBox="0 0 660 352" role="img" aria-label="Khala unifies fragmented, tacit knowledge — docs, specs, traces, configs, know-how — into one link. From that single link, a human developer and an AI agent read the same shared view: one source of truth. Below, Adept reads the same link as a ledger: what must be known is the denominator of cognitive debt, measured as vouch coverage. The tools connect only through Khala.">
  <style>
    text { font-family: ui-monospace, 'JetBrains Mono', 'Cascadia Code', monospace; dominant-baseline: middle; }
    .lbl { fill: #6b7480; font-size: 10px; letter-spacing: .14em; }
    .n { fill: #8b95a3; font-size: 11px; }
    .k { fill: #4f8fc4; font-size: 12px; letter-spacing: .14em; }
    .kd { fill: #6b7480; font-size: 9.5px; letter-spacing: .14em; }
    .box { fill: none; stroke: #7b8492; stroke-width: 1.3; }
    .khala { fill: none; stroke: #4f8fc4; stroke-width: 1.6; }
    .card { fill: none; stroke: #4f8fc4; stroke-width: 1.5; }
    .tacit { stroke: #7b8492; stroke-width: 1; fill: none; stroke-dasharray: 3 3; opacity: .8; }
    .ln { stroke: #4f8fc4; stroke-width: 1.2; fill: none; }
    .cap { fill: #6b7480; font-size: 10px; letter-spacing: .04em; }
    .s { fill: #6b7480; font-size: 9px; }
  </style>
  <defs>
    <marker id="ec-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f8fc4"/></marker>
  </defs>

  <text class="lbl" x="24" y="24">FRAGMENTED · TACIT</text>
  <text class="lbl" x="636" y="24" text-anchor="end">ONE SHARED VIEW</text>

  <path class="tacit" d="M124 59 L288 150"/>
  <path class="tacit" d="M124 97 L288 150"/>
  <path class="tacit" d="M124 135 L288 150"/>
  <path class="tacit" d="M124 173 L288 150"/>
  <path class="tacit" d="M124 211 L288 150"/>

  <rect class="box" x="24" y="46" width="100" height="26" rx="5"/>
  <text class="n" x="74" y="59" text-anchor="middle">docs</text>
  <rect class="box" x="24" y="84" width="100" height="26" rx="5"/>
  <text class="n" x="74" y="97" text-anchor="middle">specs</text>
  <rect class="box" x="24" y="122" width="100" height="26" rx="5"/>
  <text class="n" x="74" y="135" text-anchor="middle">traces</text>
  <rect class="box" x="24" y="160" width="100" height="26" rx="5"/>
  <text class="n" x="74" y="173" text-anchor="middle">configs</text>
  <rect class="box" x="24" y="198" width="100" height="26" rx="5"/>
  <text class="n" x="74" y="211" text-anchor="middle">know-how</text>

  <rect class="khala" x="290" y="60" width="44" height="200" rx="12"/>
  <text class="k" x="312" y="34" text-anchor="middle">KHALA</text>
  <text class="kd" x="312" y="49" text-anchor="middle">THE LINK</text>

  <path class="ln" d="M334 150 L406 150" marker-end="url(#ec-a)"/>

  <rect class="card" x="410" y="104" width="176" height="92" rx="8"/>
  <text class="k" x="428" y="128" style="font-size:10px">SHARED VIEW</text>
  <text class="n" x="428" y="152">payment-service → ledger</text>
  <text class="kd" x="428" y="174" style="letter-spacing:.04em">one source of truth</text>

  <rect class="box" x="440" y="52" width="120" height="30" rx="6"/>
  <text class="n" x="500" y="67" text-anchor="middle">Developer</text>
  <path class="ln" d="M500 82 L500 104" marker-end="url(#ec-a)"/>
  <rect class="box" x="440" y="216" width="120" height="30" rx="6"/>
  <text class="n" x="500" y="231" text-anchor="middle">Agent</text>
  <path class="ln" d="M500 216 L500 196" marker-end="url(#ec-a)"/>

  <path class="ln" d="M312 260 L312 282" marker-end="url(#ec-a)"/>
  <rect class="box" x="250" y="286" width="124" height="32" rx="6"/>
  <text class="n" x="312" y="302" text-anchor="middle">Adept</text>
  <text class="s" x="386" y="295">reads the link as a ledger:</text>
  <text class="s" x="386" y="310">what must be known → vouch coverage</text>

  <text class="cap" x="330" y="338" text-anchor="middle">every source → one link → one shared view · and a ledger of who still understands it</text>
</svg>
