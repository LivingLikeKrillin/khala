      <stop offset="0%" stop-color="#16315c"/>
      <stop offset="100%" stop-color="#070d1d"/>
    </radialGradient>
    <linearGradient id="khala-ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6dc92"/>
      <stop offset="50%" stop-color="#cb9b3f"/>
      <stop offset="100%" stop-color="#875b21"/>
