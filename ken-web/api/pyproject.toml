[project]
name = "ken-web-api"
version = "0.1.0"
description = "FastAPI service over ken-core — the repayment web walking skeleton backend"
requires-python = ">=3.13"
dependencies = ["ken", "fastapi>=0.115", "uvicorn>=0.30", "argon2-cffi>=23.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

# `ken` is a path dependency. With uv: `uv sync` resolves it via the source below.
# With pip: install both editable from this dir — `pip install -e ../../ken -e .`
[tool.uv.sources]
ken = { path = "../../ken", editable = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
