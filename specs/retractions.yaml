# 승인된 문서의 **사후 철회**. 본문 밖에 산다.
#
# **왜 본문이 아닌가.** 승인 도장은 본문 해시다. 각주를 본문에 달면 그 도장이 깨지고,
# 다시 찍으면 "본문 고치고 도장 다시 찍기" 가 정상 절차가 된다 — 그 동작이야말로
# `scripts/ledger_integrity.py` 가 잡으려던 바로 그 동작이다. 2026-08-14 에 각주 두 개로
# master 가 15연속 빨간불이었다(#240~#254). 여기로 옮기면 승인 본문은 승인 시점 바이트로
# 얼어 있고, 철회는 그 옆에서 서명을 갖는다.
#
# **보이지 않는 철회는 깨진 해시보다 나쁘다.** 그래서 대상 문서의 frontmatter 가
# `retractions:` 로 이 파일을 가리켜야 하고, 양방향 불일치는 CI 빨간불이다. frontmatter 는
# 본문 해시가 덮지 않는 층이라(그 안에 `content_hash` 자신이 산다) 도장을 건드리지 않는다.
#
# **인용문은 실제로 그 문서에 있어야 한다.** 없는 문장을 철회하는 것은 아무것도 철회하지
# 않는 것이다. 검사가 공백을 정규화해 대조하고, `…` 로 줄인 인용은 조각마다 대조한다.
#
# 절차는 CONVENTIONS.md 의 "Retracting a claim in a signed document".

- target: SPEC-nexus-vision-reproducibility
  retracted_by: SPEC-nexus-vision-reader-of-record
  signed_by: LivingLikeKrillin
  signed_at: 2026-08-15
  quote: >-
    reader-to-reader difference was 7.4%, inside a self-variation of 84.7% … 3.6% is not zero.
    9 of 44 Gemini image pairs still differ
  why: >-
    이 문서의 백분율은 **혼종 식별자를 쪼개던 토크나이저**로 잰 값이다. `툴팁_사용가이드_02` 가
    `02` 로 잘려서, 서로 **다른** 식별자를 읽은 두 판독이 그 조각에서 일치로 세어졌다 —
    "판독기가 자기와 얼마나 다른가" 를 재는 자가 그만큼 낮게 나온다.
    그 결함은 [[SPEC-nexus-vision-reader-of-record]] §6 이 소유했고 *"고치면 이 문서의 모든 수가
    바뀌므로 자기 재측정을 동반하는 별도 변경"* 이라고 적어 뒀다. 고쳤고(2026-08-11, 커밋
    7c2d75a), 재측정했고, **그 값이 커밋 메시지에만 남았다.**
    같은 저장된 판독을 고친 자로 다시 채점한 값(2026-08-15 재현):
    **sonnet 84.7% → 82.1% · gemini 3.6% → 3.0%**.
    **판정은 아무것도 안 움직인다** — 동일쌍 수(4/20 · 35/44)가 그대로여서 Fisher p = 1.3 × 10⁻⁵
    도 그대로고, 문턱 10% 기준 통과·미달도 그대로다. 철회되는 것은 결론이 아니라 **두 백분율**이다.
    이 문서의 status 는 바뀌지 않는다 — 여전히 승인된 문서다.

- target: ADR-0010
  retracted_by: SPEC-nexus-vision-reproducibility
  signed_by: LivingLikeKrillin
  signed_at: 2026-08-15
  quote: >-
    an extraction result, once stored, is never replaced by a re-read of the same bytes under the
    same extractor identity
  why: >-
    §5 는 (바이트 해시, 추출기 신원) 쌍이 하나의 결과를 **해결한다**는 듯이 쓰였고, 그 위에
    "unchanged bytes are never re-extracted" 가 얹혀 있다. 실측이 그 전제를 깬다: 같은 그림을
    두 번 읽었을 때 한 판독기는 44장 중 35장을 같게(변이 **3.0%**), 다른 하나는 20장 중 4장만
    같게(변이 **82.1%**) 읽었다 — 두 결과의 차이는 Fisher 정확검정 p = 1.3 × 10⁻⁵.
    변이 82.1% 에서 그 쌍은 내용을 지목하지 못한다. SPEC 의 표현대로 **"the key is decorative"**.
    ⚠ 이 두 백분율은 **고쳐진 자로 다시 채점한 값**이다. `SPEC-nexus-vision-reproducibility`
    §1 의 표에 적힌 3.6%·84.7% 는 혼종 식별자를 쪼개던 토크나이저로 잰 것이고(2026-08-11 에
    고침, 커밋 7c2d75a), 그 SPEC 본문은 아직 옛 값을 들고 있다. 동일쌍 수(35/44 · 4/20)는
    변하지 않았으므로 p 는 그대로다. 판정도 그대로다 — 문턱 10% 의 양쪽 어디로도 넘지 않는다.
    살아남는 것 — 저장된 텍스트를 재읽기로 덮지 않는다는 규칙 자체(그것이 저장소를 정본으로
    삼는 이유이고, 이 측정이 그 필요를 오히려 키운다). 철회되는 것 — 그 쌍을 **내용을 식별하는
    키**로 읽는 것. 저장소를 잃거나 우회하면 바뀌지 않은 신원 아래 다른 텍스트가 들어앉고,
    그것이 §5 가 막으려던 churn 이다. 문턱(≤10%)은 그 SPEC 이 등록했다.
    이 문서의 status 는 바뀌지 않는다 — 여전히 accepted 이고, 틀린 것은 그 안의 한 전제다.

- target: ADR-0010
  retracted_by: SPEC-nexus-screenshot-text-extraction
  signed_by: LivingLikeKrillin
  signed_at: 2026-08-15
  quote: >-
    a real question was asked, the answer was unavailable, and the cause was counted (44 images,
    100–171 characters of text beside each)
  why: >-
    게이트를 fired 로 선언할 때 근거의 한 고리 — 그림을 원본에서 **다시 읽을 수 있다**는
    재해결 가능성(§2 가 machine_read 를 받아들이는 이유이고, §3.1 이 "그것 없으면 등급은
    뒤에 아무것도 없는 라벨" 이라고 못박은 것) — 은 **시스템이 갖고 있지 않은 상태에 대고
    보고됐다**: 11/11 바이트 동일이 나온 재fetch 는 블록 id 를 메모리에만 들고 돌았고,
    출하된 시스템에는 그것을 저장하는 코드가 없었다(screenshot-text-extraction §7.1b).
    **게이트 자체는 선다** — 원 수용 기준은 통과했고(§7.3), 재해결은 이후
    SPEC-nexus-vision-source-ref 가 참조를 실제로 저장·해결하게 만들어 라이브 코퍼스에서
    손 왕복 3/3 으로 성립했다. 철회되는 것은 결론이 아니라 **선언 시점에 그 근거가 성립해
    있었다는 표현**이다.
    ⚠ 이 항목의 초안은 *"§7.1a-0 가 게이트 근거를 반증했다"* 였다. **그것으로 쓰면 틀린다** —
    그 반증은 §7.3 에서 스스로 철회됐다(전수 아닌 표본으로 쓴 전칭 부정이었다). 옮겨 적기 전에
    대상 문서를 읽어서 잡았다.
    이 문서의 status 는 바뀌지 않는다 — 여전히 accepted 다.

- target: SPEC-nexus-a2a-external-exposure-audit-phase2
  retracted_by: SPEC-nexus-audit-query-hash
  signed_by: LivingLikeKrillin
  signed_at: 2026-08-14
  quote: "Audit is PII-safe. … `query_sha256` + `query_len` only."
  why: >-
    해시-only 가 PII-safe 를 뜻하지 않는다. 짧은 자연어 질의는 엔트로피가 낮아 후보 목록만
    있으면 대입으로 확인되고, `search_query_text` 가 그 목록을 평문으로 제공한다. 게다가 이
    기록은 `principal` 을 같은 행에 갖는다. 2026-08-14 이후 `query_sha256` 은 쓰지 않는다
    (새 행 NULL, migration 023). 남는 것은 `query_len` 뿐이다.
    이 문서의 status 는 바뀌지 않는다 — 여전히 승인된 문서이고, 틀린 것은 그 안의 한 결론이다.

- target: SPEC-nexus-query-text-retention
  retracted_by: SPEC-nexus-audit-query-hash
  signed_by: LivingLikeKrillin
  signed_at: 2026-08-14
  quote: >-
    Salting with the tenant fixes it structurally rather than by promise: the retention key
    equals no hash stored anywhere else, so there is nothing to join on.
  why: >-
    인용문 자체는 참이다 — 그 키와 같은 값은 정말 어디에도 없다. 거짓인 것은 거기서 도출된
    더 넓은 안전성 결론, 즉 "그러므로 텍스트와 신원이 이어지지 않는다" 다. 이 표는 질문을
    평문으로 담고, `a2a_audit.query_sha256` 은 소금 없는 `sha256(query)` 였다 — 그 평문에서
    해시를 다시 계산하면 principal 로 이어진다. 소금은 *키 동등 조인*을 막지 자기가 저장한
    평문에서의 재계산을 막지 않는다.
    이 문서의 status 는 바뀌지 않는다 — 여전히 승인된 문서이고, 틀린 것은 그 안의 한 결론이다.
