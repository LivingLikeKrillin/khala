    <g font-size="10.5" fill="#e6e6e6">
    <text x="428" y="144" font-size="10.5">sends the query</text>
    <text x="188" y="272" font-size="10.5">sends identifier query</text>
    <text x="464" y="272" font-size="10.5">sends original query</text>
    <text x="524" y="323" font-size="10.5">reads chunks</text>
    <text x="324" y="396" font-size="10.5">sends ranked lists</text>
    <text x="324" y="482" font-size="10.5">sends top 20 chunks</text>
    <text x="728" y="452" font-size="10.5">reads fills</text>
    <text x="454" y="596" font-size="10.5">sends evidence packet</text>
    <text x="280" y="635" font-size="10.5">sends draft</text>
    <text x="542" y="635" font-size="10.5">calls LLM</text>
    <text x="612" y="205" font-size="10.5">calls only with chat history</text>
    <text x="24" y="95" font-size="10.5">returns answer, citation verdicts, evidence</text>
