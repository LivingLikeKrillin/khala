<svg xmlns="http://www.w3.org/2000/svg" width="660" height="312" viewBox="0 0 660 312" role="img" aria-label="Four kinds of information — documented knowledge, design decisions, operational facts, comprehension — flow into one governed substrate that keeps them approved, current, and cited. A human and an agent read it through two doors and see the same view.">
  <style>
    text { font-family: ui-monospace, 'JetBrains Mono', 'Cascadia Code', monospace; dominant-baseline: middle; }
    .lbl { fill: #6b7480; font-size: 10px; letter-spacing: .14em; }
    .n { fill: #8b95a3; font-size: 11px; }
    .s { fill: #6b7480; font-size: 9px; }
    .k { fill: #4f8fc4; font-size: 12px; letter-spacing: .14em; }
    .kd { fill: #6b7480; font-size: 9.5px; letter-spacing: .1em; }
    .box { fill: none; stroke: #7b8492; stroke-width: 1.3; }
    .khala { fill: none; stroke: #4f8fc4; stroke-width: 1.6; }
    .fl { stroke: #7b8492; stroke-width: 1; fill: none; }
    .ln { stroke: #4f8fc4; stroke-width: 1.2; fill: none; }
    .cap { fill: #6b7480; font-size: 10px; letter-spacing: .04em; }
  </style>
  <defs>
    <marker id="si-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f8fc4"/></marker>
  </defs>

  <text class="lbl" x="24" y="24">FOUR KINDS OF INFORMATION</text>
  <text class="lbl" x="636" y="24" text-anchor="end">TWO DOORS · ONE VIEW</text>

  <path class="fl" d="M208 66 L302 153"/>
  <path class="fl" d="M208 124 L302 153"/>
  <path class="fl" d="M208 182 L302 153"/>
  <path class="fl" d="M208 240 L302 153"/>

  <rect class="box" x="24" y="46" width="184" height="40" rx="5"/>
  <text class="n" x="36" y="60">what the org knows</text>
  <text class="s" x="36" y="76">docs · specs · know-how</text>
  <rect class="box" x="24" y="104" width="184" height="40" rx="5"/>
  <text class="n" x="36" y="118">why it was built</text>
  <text class="s" x="36" y="134">design decisions</text>
  <rect class="box" x="24" y="162" width="184" height="40" rx="5"/>
  <text class="n" x="36" y="176">what it is doing</text>
  <text class="s" x="36" y="192">traces · metrics · logs</text>
  <rect class="box" x="24" y="220" width="184" height="40" rx="5"/>
  <text class="n" x="36" y="234">who still understands it</text>
  <text class="s" x="36" y="250">vouches · coverage</text>

  <rect class="khala" x="304" y="58" width="44" height="192" rx="12"/>
  <text class="k" x="326" y="42" text-anchor="middle">KHALA</text>
  <text class="kd" x="326" y="268" text-anchor="middle">approved · current · cited</text>

  <path class="ln" d="M348 128 L426 96" marker-end="url(#si-a)"/>
  <path class="ln" d="M348 180 L426 212" marker-end="url(#si-a)"/>

  <rect class="box" x="430" y="72" width="150" height="42" rx="6"/>
  <text class="n" x="442" y="87">Human</text>
  <text class="s" x="442" y="103">web · answers with sources</text>
  <rect class="box" x="430" y="192" width="150" height="42" rx="6"/>
  <text class="n" x="442" y="207">Agent</text>
  <text class="s" x="442" y="223">MCP · A2A</text>

  <text class="cap" x="330" y="298" text-anchor="middle">four kinds of information → one governed substrate → the same view for human and agent</text>
</svg>
