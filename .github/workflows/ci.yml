# CI for the khala monorepo.
#
# One job per subproject. Configured now; it activates automatically once the
# repo is pushed to GitHub (owner action). Versions match the local environment
# that passed: Python 3.13, Node 20.
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  deps:
    name: deps (pinned + bounded)
    runs-on: ubuntu-latest
    # Two halves of the same guarantee:
    #
    #   constraints.txt governs CI. Every Python job installs with `-c constraints.txt`,
    #   which pins only the packages it lists — add a dependency without refreshing the lock
    #   and that one package goes back to being resolved fresh on every run.
    #
    #   The upper bound governs everywhere else: a new checkout, a rebuilt image, a
    #   developer's machine. `mcp>=1.2.0` with no ceiling is how 2.0.0 got in.
    #
    # This job fails if either half is missing for any declared requirement.
    #
    # The check is offline and does NOT re-resolve: a guard that recompiles against live
    # PyPI would fail the moment anything upstream publishes, which is the exact
    # nondeterminism the constraints exist to remove.
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # Bounded for the same reason as everything else here: this job's own install must not
      # be the one thing that re-resolves freely. `packaging` is the only dependency the
      # checker has, and it is used for `Requirement` / specifier parsing.
      - run: pip install "packaging>=24,<26"
      - name: Verify every declared dependency is pinned and bounded
        run: python scripts/lock_deps.py --check

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    # `task lint` existed but nothing ran it, so it was lint in name only — the same
    # failure mode as a skipped test. It had drifted red (an unused import, an over-long
    # line) without anyone seeing it.
    #
    # Scope is the whole repo, not the three directories `task lint:ruff` used to name:
    # adept, adept-web and the root `tests/` were unlinted purely because nobody listed
    # them. ruff resolves config per file, so nexus keeps line-length 120 and the rest
    # take the root ruff.toml's 100.
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # ruff comes from the committed lock, not a fresh resolve — a lint job that picks up
      # whatever version shipped this morning turns master red on someone else's schedule,
      # which is the whole lesson of #147. `task deps:lock` is how the version moves.
      - name: Install ruff (pinned by nexus/constraints.txt)
        run: pip install ruff -c nexus/constraints.txt
      - run: ruff --version
      - name: Check
        run: ruff check .

  nexus:
    name: nexus (pytest, unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install nexus
        working-directory: nexus
        # [mcp] extra is required so tests/test_mcp.py can import nexus.mcp.server.
        # -c constraints.txt: pins the whole resolved set. Without it pip re-resolves every
        # run and an upstream major release turns an unrelated PR red (see constraints.txt).
        run: pip install -e ".[dev,mcp]" -c constraints.txt
      # Unit tests only. The DB-backed tests run in `nexus-postgres` below.
      - name: Run unit tests
        working-directory: nexus
        # NEXUS_REQUIRE_COMPOSE=1 turns the compose-wiring suite's "docker not here" skip into a
        # failure. That suite guards the trap where a literal `environment:` value beats the
        # deployment's `.env` — a cutover that reports success and changes nothing. A check that
        # quietly does not run would leave exactly that hole open (same rule as REQUIRE_MECAB).
        env:
          NEXUS_REQUIRE_COMPOSE: "1"
        run: python -m pytest -q -m "not integration"

  nexus-postgres:
    name: nexus (pytest, postgres)
    runs-on: ubuntu-latest
    # Nexus has three code paths that hide data — supersede, soft_delete, revive —
    # and their guarantees live entirely in DB-backed tests. Without this job CI is
    # blind to the only failures that lose a corpus.
    services:
      postgres:
        # pgvector: init.sql needs the `vector` and `pg_trgm` extensions.
        # mecab is NOT needed — tsvector_ko is filled by the app, not a generated column.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: nexus_test
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXUS_TEST_DB_URL: postgresql://nexus:nexus@localhost:5432/nexus_test
      DATABASE_URL: postgresql://nexus:nexus@localhost:5432/nexus_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install nexus
        working-directory: nexus
        # [a2a] so the external-ingest sink and its tests are exercised, not silently skipped.
        run: pip install -e ".[dev,mcp,a2a]" -c constraints.txt
      - name: Apply baseline schema
        working-directory: nexus
        run: psql "$DATABASE_URL" -f init.sql
      - name: Declare this database disposable
        working-directory: nexus
        # The suite TRUNCATEs. It refuses to attach to a database that has not said so —
        # that guard is what stops someone pointing NEXUS_TEST_DB_URL at a real corpus.
        run: psql "$DATABASE_URL" -f tests/disposable_db.sql
      - name: Apply migrations
        working-directory: nexus
        # init.sql is only the empty-DB baseline; superseded_by and v_entropy_signals
        # arrive as deltas. Skipping this is exactly how a fresh install ends up broken.
        run: python -m scripts.migrate
      - name: Run full suite against Postgres
        working-directory: nexus
        run: python -m pytest -q

  nexus-recall:
    name: nexus (search recall, mecab)
    runs-on: ubuntu-latest
    # The recall suite measures the keyword leg, and the keyword leg is mecab-ko. Without the
    # Korean tokenizer `tokenize_korean` falls back to splitting on spaces — a different ruler,
    # and a floor measured with it guards nothing. mecab-ko is built from source in the image,
    # so the suite runs inside the image. `NEXUS_REQUIRE_MECAB=1` turns a silent skip into a
    # red build, which is the whole lesson: a test that quietly does not run is not a test.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: nexus_test
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - name: Apply baseline schema
        working-directory: nexus
        run: psql "postgresql://nexus:nexus@localhost:5432/nexus_test" -f init.sql
      - name: Declare this database disposable
        working-directory: nexus
        run: psql "postgresql://nexus:nexus@localhost:5432/nexus_test" -f tests/disposable_db.sql
      - name: Build the app image (mecab-ko is compiled here)
        working-directory: nexus
        run: docker build -t nexus-app:ci .
      - name: Run the recall and Korean-eval suites inside the image
        working-directory: nexus
        # Two independent rulers share this job because they share one requirement (mecab-ko in
        # the image). test_search_recall guards the keyword leg against the AND regression on its
        # own five-document fixture; test_ko_eval_run_db measures the 265-document Korean pack
        # against floors pinned to a pack and label revision. Different corpora, different floors,
        # no precedence between them (SPEC-nexus-korean-retrieval-eval §3).
        run: |
          docker run --rm --network host \
            -e NEXUS_TEST_DB_URL=postgresql://nexus:nexus@localhost:5432/nexus_test \
            -e DATABASE_URL=postgresql://nexus:nexus@localhost:5432/nexus_test \
            -e NEXUS_REQUIRE_MECAB=1 \
            -v "$PWD:/app" -w /app \
            nexus-app:ci python -m pytest -q \
              tests/test_search_recall.py tests/test_recall_suite_runs.py tests/test_ko_eval_run_db.py

  observer:
    name: observer (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: observer/pnpm-lock.yaml
      - name: Install observer
        working-directory: observer
        # --frozen-lockfile is pnpm's CI default, but stated explicitly so it does not
        # hinge on the CI env var being set.
        run: pnpm install --frozen-lockfile
      - name: Run tests
        working-directory: observer
        run: pnpm test:run

  arbiter:
    name: arbiter (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install arbiter
        working-directory: arbiter
        run: pip install -e ".[dev]" -c constraints.txt
      - name: Run tests
        working-directory: arbiter
        run: python -m pytest -q

  ecosystem-e2e:
    name: ecosystem (a2a e2e, arbiter + nexus)
    runs-on: ubuntu-latest
    # The only tests that wire two tools together over A2A live in the repo root, and until now
    # nothing ran them: every job installs one package, both suites start with `importorskip`, so
    # they skipped silently in every environment that existed. A suite that never runs is not a
    # suite — the same lesson as NEXUS_REQUIRE_MECAB, here enforced by KHALA_REQUIRE_E2E.
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # nexus WITHOUT the [mcp] extra on purpose: arbiter needs mcp>=2 and nexus's mcp surface
      # pins mcp<2, so the two cannot share an environment. The e2e path touches nexus core,
      # which does not import mcp, so this pairing is the one that can coexist.
      - name: Install nexus (a2a extra, no mcp extra)
        working-directory: nexus
        run: pip install -e ".[dev,a2a]" -c constraints.txt
      - name: Install arbiter
        working-directory: arbiter
        run: pip install -e ".[dev]" -c constraints.txt
      - name: Run the cross-tool E2E
        env:
          KHALA_REQUIRE_E2E: "1"
        run: python -m pytest -q tests/

  probe:
    name: probe (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install probe
        working-directory: probe
        run: pip install -e ".[dev]" -c constraints.txt
      - name: Run tests
        working-directory: probe
        run: python -m pytest -q

  adept:
    name: adept (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install adept
        working-directory: adept
        run: pip install -e ".[dev]" -c constraints.txt
      - name: Run tests
        working-directory: adept
        run: python -m pytest -q

  adept-postgres:
    name: adept (pytest, postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: adept
          POSTGRES_USER: adept
          POSTGRES_PASSWORD: adept
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adept -d adept"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ADEPT_TEST_DATABASE_URL: postgresql://adept:adept@localhost:5432/adept
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install adept (with postgres extra)
        working-directory: adept
        run: pip install -e ".[dev,postgres]" -c constraints.txt
      - name: Apply schema
        working-directory: adept
        run: psql "$ADEPT_TEST_DATABASE_URL" -f db/init.sql
      # Runs the shared store contract; with ADEPT_TEST_DATABASE_URL set the
      # PostgresStore params run too (the default adept job stays DB-free / file-only).
      - name: Run store contract (file + postgres)
        working-directory: adept
        run: python -m pytest -q tests/test_store_contract.py

  adept-web-api:
    name: adept-web-api (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install adept-web-api
        working-directory: adept-web/api
        # adept is a path dependency installed editable alongside the API.
        run: pip install -e ../../adept -e ".[dev]" -c constraints.txt
      - name: Run tests
        working-directory: adept-web/api
        run: python -m pytest -q

  nexus-web:
    name: nexus-web (vitest)
    runs-on: ubuntu-latest
    # The web UI is vanilla ESM with no build step, so its logic went untested for a long time —
    # freshnessLabel and corpusHint were verified only by driving the browser. vitest covers the
    # pure modules now; DOM wiring stays a browser check.
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: nexus/nexus/web/package-lock.json
      - name: Install
        working-directory: nexus/nexus/web
        run: npm ci
      - name: Run tests
        working-directory: nexus/nexus/web
        run: npm test

  adept-web:
    name: adept-web (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: adept-web/web/package-lock.json
      - name: Install adept-web
        working-directory: adept-web/web
        run: npm ci
      - name: Run tests
        working-directory: adept-web/web
        run: npm run test -- --run
      - name: Build
        working-directory: adept-web/web
        run: npm run build

  docs:
    name: docs (build + linkcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install docs
        working-directory: docs
        # npm ci, not npm install — every other Node job already installs from its lockfile,
        # and `npm install` is free to resolve something newer and rewrite the lock in place.
        run: npm ci
      - name: Build site
        working-directory: docs
        run: npm run build
      - name: Type check
        working-directory: docs
        run: npm run check
      - name: Link check
        working-directory: docs
        run: npm run linkcheck
