# CI for the khala monorepo.
#
# One job per subproject. Configured now; it activates automatically once the
# repo is pushed to GitHub (owner action). Versions match the local environment
# that passed: Python 3.13, Node 20.
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  nexus:
    name: nexus (pytest, unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install nexus
        working-directory: nexus
        # [mcp] extra is required so tests/test_mcp.py can import nexus.mcp.server.
        run: pip install -e ".[dev,mcp]"
      # Unit tests only. DB integration tests (-m integration) need Postgres and
      # are run locally / by the owner — no postgres service in the baseline job.
      - name: Run unit tests
        working-directory: nexus
        run: python -m pytest -q -m "not integration"

  probe:
    name: probe (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: probe/pnpm-lock.yaml
      - name: Install probe
        working-directory: probe
        run: pnpm install
      - name: Run tests
        working-directory: probe
        run: pnpm test:run

  specledger:
    name: specledger (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install specledger
        working-directory: specledger
        run: pip install -e ".[dev]"
      - name: Run tests
        working-directory: specledger
        run: python -m pytest -q

  mutqa:
    name: mutqa (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install mutqa
        working-directory: mutqa
        run: pip install -e ".[dev]"
      - name: Run tests
        working-directory: mutqa
        run: python -m pytest -q

  ken:
    name: ken (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install ken
        working-directory: ken
        run: pip install -e ".[dev]"
      - name: Run tests
        working-directory: ken
        run: python -m pytest -q

  ken-postgres:
    name: ken (pytest, postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ken
          POSTGRES_USER: ken
          POSTGRES_PASSWORD: ken
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ken -d ken"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KEN_TEST_DATABASE_URL: postgresql://ken:ken@localhost:5432/ken
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install ken (with postgres extra)
        working-directory: ken
        run: pip install -e ".[dev,postgres]"
      - name: Apply schema
        working-directory: ken
        run: psql "$KEN_TEST_DATABASE_URL" -f db/init.sql
      # Runs the shared store contract; with KEN_TEST_DATABASE_URL set the
      # PostgresStore params run too (the default ken job stays DB-free / file-only).
      - name: Run store contract (file + postgres)
        working-directory: ken
        run: python -m pytest -q tests/test_store_contract.py

  ken-web-api:
    name: ken-web-api (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install ken-web-api
        working-directory: ken-web/api
        # ken is a path dependency installed editable alongside the API.
        run: pip install -e ../../ken -e ".[dev]"
      - name: Run tests
        working-directory: ken-web/api
        run: python -m pytest -q

  ken-web:
    name: ken-web (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ken-web/web/package-lock.json
      - name: Install ken-web
        working-directory: ken-web/web
        run: npm ci
      - name: Run tests
        working-directory: ken-web/web
        run: npm run test -- --run
      - name: Build
        working-directory: ken-web/web
        run: npm run build

  docs:
    name: docs (build + linkcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install docs
        working-directory: docs
        run: npm install
      - name: Build site
        working-directory: docs
        run: npm run build
      - name: Type check
        working-directory: docs
        run: npm run check
      - name: Link check
        working-directory: docs
        run: npm run linkcheck
