[project]
name = "khala-arbiter"
version = "0.1.0"
description = "Arbiter — ADR/SDD recording & accountable-review governance MCP"
requires-python = ">=3.11"
# Upper bounds sit at the next major above the version we test (0.x bounds at <1) —
# see CONVENTIONS.md. constraints.txt fixes CI; these bounds cover installs outside it.
dependencies = [
    # See nexus/pyproject.toml — mcp 2.0.0 drops `mcp.server.fastmcp`; pin <2 until migrated.
    "mcp>=1.2.0,<2",
    "anthropic>=0.40.0,<1",
    "pyyaml>=6.0,<7",
    "typer>=0.12,<1",
]

[project.scripts]
# 사람(과 에이전트)이 손으로 게이트를 돌리는 진입점. MCP 서버와 같은 함수를 부른다.
arbiter = "khala.arbiter.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0,<10", "ruff>=0.6,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/khala"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
