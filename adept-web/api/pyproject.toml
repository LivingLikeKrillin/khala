[project]
name = "khala-adept-web"
version = "0.1.0"
description = "FastAPI service over Adept core — the repayment web walking skeleton backend"
requires-python = ">=3.13"
dependencies = ["khala-adept", "fastapi>=0.115", "uvicorn>=0.30", "argon2-cffi>=23.1"]

[project.scripts]
adept-web-admin = "khala.adept_web.admin:main"

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

# `khala-adept` is a path dependency. With uv: `uv sync` resolves it via the source below.
# With pip: install both editable from this dir — `pip install -e ../../adept -e .`
[tool.uv.sources]
khala-adept = { path = "../../adept", editable = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
