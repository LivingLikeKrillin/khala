# Taskfile for the khala monorepo (https://taskfile.dev).
#
# Wraps the per-subproject commands (the source of truth in each subproject)
# so the whole repo can be tested / built / linted from the root.
#
#   task test       -> run every subproject's test suite
#   task build      -> build the docs site
#   task lint       -> ruff check across the Python subprojects
#   task deps:lock  -> regenerate the committed dependency constraints (after changing a dep)
#   task deps:check -> verify the constraints still cover every declared dependency
#
# Install go-task: https://taskfile.dev/installation/  (the CLI is not required
# to read this file — CI calls the underlying commands directly.)
version: "3"

tasks:
  # ---- run (one-command quickstart) --------------------------------------
  # `up` 은 마이그레이션까지 돌린다. init.sql 은 빈 DB 베이스라인일 뿐이라, 이게 없으면
  # 새 설치는 영원히 migration 0 에 머문다 — supersede·entropy-signals·소스 콘솔이
  # "relation does not exist" 로 죽는다. 멱등이므로 매번 돌려도 무해하다.
  up:
    desc: "Nexus 기동 (db·ollama·app + DB 마이그레이션). 최초엔 'task models'로 임베딩 모델도 받으세요"
    dir: nexus
    cmds:
      - docker compose up -d --wait
      - docker compose exec -T nexus-app python -m scripts.migrate
      - 'echo "Nexus → http://localhost:8000  (최초 1회: task models)"'

  models:
    desc: "임베딩 모델 받기 (최초 1회) — nomic-embed-text (config.yaml embedding.model 과 일치)"
    dir: nexus
    cmds:
      - docker compose exec nexus-ollama ollama pull nomic-embed-text

  update:
    desc: "Nexus 업데이트 — 이미지 재빌드·재기동 + DB 마이그레이션 적용 (코드는 먼저 git pull 하세요)"
    dir: nexus
    cmds:
      - docker compose build nexus-app
      - docker compose up -d
      - docker compose exec -T nexus-app python -m scripts.migrate
      - 'echo "업데이트 완료 → http://localhost:8000"'

  down:
    desc: "Nexus 정지"
    dir: nexus
    cmds:
      - docker compose down

  # ---- 팀 도그푸딩 배포 (prod 오버레이) -----------------------------------
  # 로컬 dev 와 달리 docker-compose.override.yml 을 병합하지 않는다(-f 명시).
  # 자세한 절차는 nexus/docs/TEAM_DOGFOOD_DEPLOY.md.
  # 기동 전에 토큰 강도를 확인한다. 이게 없으면 앱이 부트 거부 → restart:unless-stopped 가
  # 크래시루프로 감싸버려서, 운영자는 `Restarting (3)` 만 보고 이유는 로그를 파야 안다.
  preflight:prod:
    internal: true
    dir: nexus
    silent: true
    cmds:
      - |
        tok="${NEXUS_DEV_TOKEN:-}"
        if [ -z "$tok" ] && [ -f .env ]; then
          tok=$(sed -n 's/^NEXUS_DEV_TOKEN=//p' .env | tail -1 | tr -d '\r"')
        fi
        if [ -z "$tok" ]; then
          echo "✗ NEXUS_DEV_TOKEN 이 없습니다."
          echo "  발급: docker compose run --rm nexus-app python -m nexus.cli auth gen-token"
          echo "  → nexus/.env 의 NEXUS_DEV_TOKEN 에 넣으세요 (docs/TEAM_DOGFOOD_DEPLOY.md §1)"
          exit 1
        fi
        if [ "$tok" = "nexus-local-dev" ] || [ ${#tok} -lt 24 ]; then
          echo "✗ NEXUS_DEV_TOKEN 이 약합니다 (기본값이거나 24자 미만, 현재 ${#tok}자)."
          echo "  GET /auth/dev-token 은 도달한 누구에게나 INTERNAL bearer 를 내줍니다."
          echo "  터널 배포에는 강값이 필수입니다 (docs/TEAM_DOGFOOD_DEPLOY.md §0)."
          exit 1
        fi
        echo "✓ NEXUS_DEV_TOKEN 강도 확인 (${#tok}자)"

  up:prod:
    desc: "팀 배포 기동 — reload·코드마운트 없이, 127.0.0.1:8000 바인드. NEXUS_DEV_TOKEN(강값) 필수"
    dir: nexus
    cmds:
      - task: preflight:prod
      # --wait: 컨테이너가 healthy 가 될 때까지 기다리고, 죽거나 unhealthy 면 0 이 아닌 코드로 끝난다.
      - docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --wait --wait-timeout 300
      - 'echo "Nexus(prod) → http://127.0.0.1:8000  · 다음: cloudflared tunnel run <터널명>"'

  # down/exec 은 prod 오버레이를 붙이지 않는다 — compose 는 서브커맨드와 무관하게 변수를
  # 보간하므로, `-f docker-compose.prod.yml down` 은 NEXUS_DEV_TOKEN 이 없으면 실패한다.
  # 컨테이너는 프로젝트명(디렉터리 = nexus)으로 찾으므로 base 파일만으로 충분하다.
  down:prod:
    desc: "팀 배포 정지"
    dir: nexus
    cmds:
      - docker compose -f docker-compose.yml down

  update:prod:
    desc: "팀 배포 업데이트 — 재빌드·재기동 + DB 마이그레이션 (코드는 먼저 git pull 하세요)"
    dir: nexus
    cmds:
      - task: preflight:prod
      - docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --wait --wait-timeout 300
      - docker compose -f docker-compose.yml exec -T nexus-app python -m scripts.migrate
      - 'echo "업데이트 완료"'

  # 예)  task ingest:notion ROOTS="p1,p2"
  #      task ingest:notion ROOTS="p1,p2" FLAGS="--reconcile --dry-run"   # 삭제 반영 계획만
  #      task ingest:notion ROOTS="p1,p2" FLAGS="--reconcile"             # soft_delete + revive
  ingest:notion:
    desc: "팀 Notion 적재 — ROOTS='pageId1,pageId2' [FLAGS='--reconcile'] (콘텐츠해시 멱등 → cron 재실행 안전)"
    dir: nexus
    cmds:
      - docker compose -f docker-compose.yml exec -T nexus-app python -m nexus.cli ingest-notion --roots "{{.ROOTS}}" {{.FLAGS}}

  # 팀이 실제로 물은 것: *"왜 서비스이름이 칼라인거지?"* (2026-08-14). 그때 봇은 👎 not_found 를
  # 받았다 — 코퍼스의 47% 가 이미 khala 자기 문서인데도. 적재 경로가 `nexus/docs/` 폴더
  # 하나여서, **이름과 목적을 설명하는 문서만** 그 밖에 있었기 때문이다.
  # **사본을 리포에 남기지 않는다.** 실행 시점에 정본에서 복사하고 끝나면 지운다 — 미러링된
  # 사본은 정본이 바뀌는 날부터 거짓말을 시작한다. 파일명이 고정이라 재실행은 멱등하다.
  ingest:self:
    desc: "khala 자기 문서(철학·컴포넌트 작명) 적재 — 팀 코퍼스에 '이 도구가 뭐냐'의 답을 넣는다"
    dir: nexus
    vars:
      TENANT: '{{.TENANT | default "default"}}'
    cmds:
      - rm -rf .self-docs && mkdir -p .self-docs
      - defer: rm -rf .self-docs
      - cp ../docs/src/content/docs/ko/philosophy.md .self-docs/khala-philosophy.md
      - cp ../adr/ADR-0005-component-naming-rename-and-forward-mapping.md .self-docs/khala-component-naming.md
      - docker compose -f docker-compose.yml exec -T nexus-app python -m nexus.cli ingest /app/.self-docs --tenant "{{.TENANT}}"

  # ---- aggregate ----------------------------------------------------------
  test:
    desc: Run all subproject test suites (nexus, observer, arbiter, probe, docs)
    cmds:
      - task: test:nexus
      - task: test:observer
      - task: test:arbiter
      - task: test:probe
      - task: test:docs

  build:
    desc: Build the docs site (Astro Starlight)
    cmds:
      - task: build:docs

  lint:
    desc: Lint the Python subprojects (ruff, check-only)
    cmds:
      - task: lint:ruff

  # Opt-in, because git will not install hooks for you. CI enforces the same rule on every pull
  # request; this only moves the catch earlier - to before the message is written, which for a
  # commit message is the only moment that is actually reversible.
  hooks:
    desc: "Install the local git hooks (blocks a commit message carrying a partner fingerprint)"
    cmds:
      - git config core.hooksPath scripts/hooks
      - 'echo "core.hooksPath = scripts/hooks. Undo with: git config --unset core.hooksPath"'

  # ---- dependency constraints --------------------------------------------
  # Every install below passes `-c constraints.txt`. pyproject.toml stays the source of
  # truth for what is required; constraints.txt records which versions we actually tested.
  # Without it pip re-resolves on every run and an upstream major release breaks unrelated
  # work — which is what mcp 2.0.0 did to master on 2026-08-01.
  deps:lock:
    desc: "Regenerate the committed dependency constraints (run after adding/upgrading a dep, then commit)"
    cmds:
      - pip install --quiet uv
      - python scripts/lock_deps.py

  deps:check:
    desc: "Verify constraints.txt still covers every declared dependency (offline; no re-resolution)"
    cmds:
      - pip install --quiet packaging
      - python scripts/lock_deps.py --check

  # ---- per-subproject test subtasks --------------------------------------
  test:nexus:
    desc: nexus unit tests (DB integration tests need Docker — run locally)
    dir: nexus
    cmds:
      # [mcp] extra lets tests/test_mcp.py import nexus.mcp.server in a clean env.
      # -m "not integration" keeps the baseline run DB-free.
      - pip install -e ".[dev,mcp]" -c constraints.txt
      - python -m pytest -q -m "not integration"

  test:observer:
    desc: observer tests (vitest)
    dir: observer
    cmds:
      - pnpm install --frozen-lockfile
      - pnpm test:run

  test:arbiter:
    desc: arbiter tests (pytest)
    dir: arbiter
    cmds:
      - pip install -e ".[dev]" -c constraints.txt
      - python -m pytest -q

  test:probe:
    desc: probe tests (pytest)
    dir: probe
    cmds:
      - pip install -e ".[dev]" -c constraints.txt
      - python -m pytest -q

  test:docs:
    desc: docs typecheck (astro check)
    dir: docs
    cmds:
      - npm ci
      - npm run check

  # ---- build subtasks -----------------------------------------------------
  build:docs:
    desc: Build the docs site and run the link checker
    dir: docs
    cmds:
      - npm ci
      - npm run build
      - npm run check
      - npm run linkcheck

  # ---- lint subtasks ------------------------------------------------------
  lint:ruff:
    desc: ruff check across the repo (check-only baseline — same scope as the CI lint job)
    cmds:
      # Whole repo, matching CI. Naming three directories left adept, adept-web and the
      # root tests/ unlinted, and the gap was invisible because nothing ran this in CI.
      - ruff check .

  llm-bridge:
    desc: "Dev-only — run the claude-code LLM bridge on the host (keyless narration via the running Claude Code). Requires NEXUS_LLM_BRIDGE_TOKEN. Point Nexus at it with NEXUS_LLM_PROVIDER=claude-code."
    dir: nexus
    cmds:
      - python -m nexus.tools.claude_llm_bridge
