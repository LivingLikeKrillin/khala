# Archon 도메인 claim 시드 (예시 앱(sample-app)의 코드 상수)
# `nexus claim-seed claims.yaml` — config.code_source.repo_path를 sample-app으로 설정 후.
# value_source는 대상 코드의 static final 상수. 조회 시점에 현재값을 재읽기.
# **한정자(`Class.`)는 장식이 아니다** — 그 타입을 선언한 파일에서만 찾는다. 한정자 없이
# 적었는데 같은 이름이 여러 곳에 다른 값으로 있으면 해석기는 답하지 않고 좁히라고 말한다.
# 테스트 소스와 빌드 산출물은 값의 출처가 아니다(제외).
#
# 소유자의 **판정**을 붙일 수 있다 (migration 044). 문서 값과 코드 값이 갈렸을 때 소유자가
# 정한 값을 적어 두면 답변이 그 값을 결정된 값으로 내고, 코드 현재 값이 다르면 어긋남으로
# 표시한다. `ruled_by`·`ruled_on` 없는 판정은 시드가 거부한다. `value_source` 없이 판정만
# 있는 claim 도 된다(해석기가 못 읽는 코드 모양에도 판정은 있다). 모양:
#   ruled_value: "3"                 # 없으면 「기각, 대체 미정」 같은 판정 — ruling_note 에 적는다
#   ruled_source: "정책 문서 §2"      # 무엇을 정본으로 봤나 (사람이 읽는 말)
#   ruled_by: "@product-owner"
#   ruled_on: "2026-09-23"           # 따옴표 — YAML 이 날짜로 읽어도 시드가 문자열로 맞춘다
#   ruling_note: "코드 5 는 3 으로 고칠 것"
- claim_id: basic-max-projects
  kind: invariant
  concepts: [Basic, 프로젝트]
  statement: "Basic 등급은 프로젝트를 최대 N개 가질 수 있다"
  value_source: "PlanPolicy.BASIC_MAX_PROJECTS"
  value_ref_kind: code_constant
  criticality: core
  owner: "@backend-lead"
- claim_id: pro-max-projects
  kind: invariant
  concepts: [Pro, 프로젝트]
  statement: "Pro 등급은 프로젝트를 최대 N개 가질 수 있다"
  value_source: "PlanPolicy.PRO_MAX_PROJECTS"
  value_ref_kind: code_constant
  criticality: core
  owner: "@backend-lead"
- claim_id: max-tasks-per-project
  kind: invariant
  concepts: [프로젝트, 작업]
  statement: "프로젝트 하나에 작업을 최대 N개 담을 수 있다"
  value_source: "ProjectService.MAX_TASKS_PER_PROJECT"
  value_ref_kind: code_constant
  criticality: core
  owner: "@backend-lead"
- claim_id: guest-name-max-attempts
  kind: invariant
  concepts: [게스트, 이름]
  statement: "게스트 이름 자동 생성은 최대 N회 시도한다"
  value_source: "GuestService.NAME_MAX_ATTEMPTS"
  value_ref_kind: code_constant
  criticality: peripheral
  owner: "@backend-lead"
