# 지연 측정용 고정 질의 세트 (SPEC-nexus-embedding-cutover-seam §4.7).
#
# **코퍼스에서 뽑지 않는다.** 이 리포지토리는 공개이고 배포 코퍼스는 실제 조직 문서다. 코퍼스에서
# 표본을 뽑으면 (1) 그 세트를 리포에 둘 수 없고, (2) 리뷰어가 재현할 수 없고, (3) 재임베딩 창
# 사이에 코퍼스가 변하면 before/after 가 **다른 워크로드**를 재게 된다. 손으로 쓴 고정 세트는
# 세 문제를 한 번에 없앤다 — 누구나 같은 세트로 다시 잴 수 있고, flip 양쪽이 구조적으로 동일하다.
#
# 세트가 노리는 것은 정답률이 아니라 **경로의 모양**이다: 형태소가 갈리는 조사·복합어, 외래어
# 표기, 한영 혼용, 그리고 아무것도 맞지 않을 질의(빈 결과 경로도 지연을 가진다).
version: 1
queries:
  # 조사·어미가 붙은 자연어 질문 (mecab-ko 가 갈라야 하는 모양)
  - "검색 품질을 어떻게 측정하나요"
  - "임베딩 모델을 교체하면 무엇이 달라지나"
  - "적재 파이프라인이 실패하면 어떻게 되나요"
  - "문서가 오래되면 검색에서 어떻게 표시되나"
  - "권한이 없는 문서는 검색 결과에 나오나요"
  # 복합 명사 (띄어쓰기 변이가 토큰을 흔드는 자리)
  - "하이브리드 검색 랭킹"
  - "벡터 인덱스 재구축"
  - "형태소 분석기 설정"
  - "문서 버전 관리 정책"
  - "감사 로그 보관 기간"
  # 외래어 표기 (한글 음차와 원어가 갈리는 자리)
  - "커넥터 동기화 실패"
  - "토큰 만료 처리"
  - "캐시 무효화 전략"
  # 한영 혼용 (실제 기술 문서의 기본 모양)
  - "Postgres 인덱스 튜닝"
  - "API 응답 스키마 변경"
  - "Docker 컨테이너 재기동 절차"
  - "OTel trace 수집 범위"
  # 짧은 키워드 (RRF 가 키워드 다리에 크게 기대는 경우)
  - "재임베딩"
  - "테넌트 격리"
  # 아무것도 맞지 않을 질의 — 빈 결과 경로도 예산을 쓴다
  - "해파리 양식장 위탁 운영 규정"
