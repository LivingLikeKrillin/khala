# 멀티턴 검색 자 — Pack A 위의 2턴 스레드 (SPEC-nexus-multi-turn-retrieval §3.4)
#
# **이 파일은 커밋한다.** 코퍼스(`tests/eval/ko/corpus/`)와 gold(`answer-labels.yaml`)가 이미
# 리포에 있으므로, 체크아웃 + Postgres + 임베딩만 있으면 누구나 같은 수를 재현한다.
#
# ── 왜 gold 를 새로 저술하지 않는가 ─────────────────────────────────────────────
# Pack A·Pack B 답변 품질은 이미 천장에 닿았다. 문서를 보고 지은 질의는 코퍼스가 반드시 답하기
# 때문이고, 후속 질문을 새로 저술하면 그 천장을 그대로 재생산한다. 그래서 여기서 저술하는 것은
# **질문의 표현**뿐이고, 정답(gold)은 `answer-labels.yaml` revision 3 에서 그대로 물려받는다.
#
# 그리고 그 덕에 **대조군이 공짜로 딸려온다**: 같은 정보 요구의 독립형(= 라벨의 원 질의)은 이미
# 측정된 상한이다. 이 자가 재는 것은 절대점수가 아니라 **독립형과 생략형 사이의 격차**이므로
# 천장이 무해하다.
#
# ── 24건을 어떻게 골랐나 ────────────────────────────────────────────────────────
# Pack A 의 answerable 40건 중,
#   (i) 질의에서 주제어를 빼도 정보 요구가 보존되는 것
#   (ii) 그 주제어를 자연스럽게 세우는 앞턴을 지어낼 수 있는 것
# 을 취했다. 뺀 16건은 대부분 주제어가 곧 질문 전체라 2턴으로 갈라지지 않는다.
# **어떤 질의가 실패할지 보고 고른 것이 아니다** — 팔은 스레드를 다 지은 뒤에 처음 돌렸다.
# 그래도 저자가 곧 이 설계의 저자라는 편향은 남는다(SPEC §7). 이 자는 **바닥 확인용**이지
# 대표성이 아니다. 대표성은 실사용 스레드에서만 온다.
#
# ── turn1 · turn2 의 규칙 ───────────────────────────────────────────────────────
#   turn2 는 **혼자서는 무엇에 대한 질문인지 알 수 없어야** 한다 (지시대명사 또는 주제어 생략).
#   turn2 의 정보 요구는 원 질의와 **같아야** 한다 — 같은 gold 로 채점하기 때문.
#   turn1 은 주제를 세우는 자연스러운 앞턴이고, 일부러 gold 를 정답으로 갖지 않는 넓은 질문이다.
#
# ── drift_turn ─────────────────────────────────────────────────────────────────
# 실제 대화는 앞에 다른 화제가 깔린다. 그 조건이 **싸구려 해법(두 턴 이어붙임)이 무너지는
# 자리**이고, 보수적 재작성이 값을 하는지 가리는 판정 팔이다(SPEC §5.2). 앞턴은 무관한 잡담이
# 아니라 **같은 코퍼스 안의 다른 주제**여야 한다 — 잡담이면 검색어에 경쟁 신호가 안 섞여서
# 아무것도 재지 않는다. 지금 값은 Pack A q029(CoreDNS)의 주제다.
#
# ── 재작성으로 되찾을 수 없는 스레드가 섞여 있다 (자를 짓다가 관측) ─────────────
# 보수적 재작성의 허용 변형은 "이력에서 생략된 주제어를 **채워 넣는** 것" 이다. 이력에 그 말이
# 없으면 채울 것이 없다. 24건 중 넷은 turn1 이 주제어를 **유의어·정황으로만** 공급한다:
#
#   q015  질의 `노드어피니티` ← turn1 은 "노드마다 GPU 유무가 달라"
#   q020  질의 `잡에서`       ← turn1 은 "잡으로 …" (1음절이라 표기가 갈린다)
#   q026  질의 `시크릿`       ← turn1 은 "비밀번호를 …"
#   q040  질의 `오토 스케일링` ← turn1 은 "클러스터 용량이 자주 모자라"
#
# 이 넷에서 재작성이 못 되찾는 것은 **재작성의 결함이 아니다** — 이력에 없는 말을 지어내는
# 재작성이 오히려 SPEC §3.2 를 어긴다. 그래서 데이터를 쉽게 고치지 않고 여기 적어 둔다:
# U3 판정에서 이 넷이 실패하면 그것은 천장이지 회귀가 아니다.
#
# revision 1 — 2026-08-13 저술. 판정 규칙은 SPEC §5 에 **구현 전에** 등록됐다.

