# Pack A 답변 라벨 — 공개 코퍼스(쿠버네티스 한국어 문서 266건) 위의 **답변 품질** 자.
#
# **이 파일은 커밋한다.** Pack B 라벨과 다른 점이 그것이고, 그것이 존재 이유다: Pack B 는 조직
# 문서라 리포에 못 올라가고, 그래서 지금까지 답변 품질 주장은 코퍼스를 가진 사람만 확인할 수
# 있었다. 여기 코퍼스는 이미 `tests/eval/ko/corpus/` 에 있으므로, 체크아웃 + Postgres +
# 임베딩 모델만 있으면 누구나 처음부터 끝까지 재현할 수 있다.
#
# 검색 라벨(`labels.yaml`, revision 2)의 질의·gold·층을 그대로 물려받고 `must_contain` 을
# 더했다 — 같은 질의를 두 자로 재기 위해서다(검색이 찾았나 / 답이 사실을 담았나).
#
# revision 1 — 2026-08-12 검토·서명. 요구는 각 질의의 rationale 이 지목한 절에서 발췌했고,
#   40건 전부 gold 본문에서 성립함을 채점기 함수(`facts_present`)로 확인했다. 대조군: 같은
#   요구를 무관한 문서에 대면 6/6 탈락한다 — 검사가 본문을 실제로 본다는 뜻이다.
#   q004 는 조였다: `크론+일정` 은 문서 어휘 되풀이로 통과할 수 있어, 필드 나열
#   (`* * * * *` 또는 `분 시 일 월`)과 `요일` 을 함께 요구한다. 맨 글자 `시`·`일`·`월` 은
#   쓰지 않았다 — 부분문자열 매칭이라 `일` 이 "일정" 에, `월` 이 "월요일" 에 걸린다.
#
# **천장은 그대로다.** 이 라벨도 문서를 보고 저술했다(`provenance: authored_from_doc`).
# 이 파일이 메우는 것은 재현성과 두 번째 코퍼스이지 대표성이 아니다 —
# 그쪽은 SPEC-nexus-query-text-retention 이 맡는다.
#
# revision 1 의 corpus 결속: 테넌트 `ko_eval_packa` 에 팩을 적재한 뒤 판정 문서 64건의
#   본문 해시로 서명했다. 이 해시는 **공개 문서에 대한 것**이라 커밋해도 안전하고,
#   재현하는 사람은 같은 청커로 같은 테넌트에 적재하면 같은 값을 얻는다 — 다르면
#   청킹이 달라진 것이고, 그것을 잡는 것이 결속의 목적이다.

# revision 2 — 2026-08-12 검토·서명. q002 의 미판정 인용 2건을 not_gold 로 판정했다:
#   `파드 및 컨테이너 리소스 관리`(22,891자)·`리밋 레인지`(3,784자) 어디에도 AppArmor 가
#   0회 나온다(전수 확인). 답이 없는 문서다 — 실제 gold 는 tutorials/security/apparmor.md.

#
# ── revision 2 의 3런 처분 (SPEC-nexus-answer-quality-ruler §6.3) ──────────────
# r3·r4·r5 (동일 조건): 35 · 34 · 35 / 40. 3런 전부 실패한 4건에 처분을 적는다.
#   q002 (앱아머)      검색 결함. gold(tutorials/security/apparmor.md)가 코퍼스에 있는데
#                      검색이 못 올린다. 답변자는 "찾을 수 없다" 고 정직하게 거절했고 충분성
#                      판정도 insufficient 다. 라벨도 자도 아니다 — 고칠 곳은 검색이다.
#   q017 (축출 순서)   **라벨 결함(내가 쓴 것).** 질의는 "어떤 파드부터 쫓겨나나" 인데 요구가
#                      `임계값|신호` 다 — 축출 신호는 다른 질문이다. 답변은 BestEffort 부터라고
#                      정확히 답했고 충분성도 sufficient 다. revision 3 에서 요구를 질의에 맞춰야
#                      한다.
#   q039 (인그레스컨트롤러) **라벨 결함(내가 쓴 것).** 질의는 선택 기준을 묻는데 요구는
#                      `IngressClass|기본` — 기본 클래스 지정 메커니즘이라 질문과 어긋난다.
#   q014 (리소스쿼터)  **자 결함.** 답변이 `[출처: 리소스 쿼터 > 오브젝트 수 쿼터]` 처럼 섹션까지
#                      붙여 인용하는데 검증기가 문자열 전체를 제목으로 보고 실패시킨다. 문서는
#                      실재한다. Pack A 의 미검증 인용 5~8건 대부분이 이 형태이고, Pack B 문서는
#                      짧아 드러나지 않았다. 별도 유닛으로 고친다(SPEC-nexus-citation-validation).
#
# revision 4 — 2026-08-17 검토·서명. **미판정 인용 28쌍을 판정했다**(질의 19건):
#   답변이 인용했으나 라벨이 gold/not_gold 어느 쪽으로도 판정하지 않아 게이트가 총점을 막고
#   있던 목록이다. 판정 규칙은 revision 1~3 과 같고 채점기와 **같은 함수**(`facts_present`)로
#   쟀다 — 요구(`must_contain`)가 본문에 전부 성립하면 gold, 하나라도 빠지면 not_gold.
#   **not_gold 10건만 적용했다.** gold 18건은 **사전등록 규칙에 막혔다**:
#   `SPEC-nexus-korean-embedding-comparison §4.5` 는 블라인드 풀의 미판정 후보(821건)를
#   먼저 판정하기 전에 gold 를 키우는 것을 금지한다 — 그 18건은 **이 시스템이 실제로 검색해
#   인용한 문서들**이라, 판정 없이 gold 로 올리면 자가 현 시스템이 찾는 것을 정답으로 세게 된다.
#   요구별 성립 근거는 `packa-adjudication-r4-worksheet.md`,
#   적용한 형태는 `packa-adjudication-r4-proposal.json` 이다.
#   판정 제안은 에이전트가 냈고 **서명은 사람이 했다** — 제안이 곧 판정이 되면 이 파일의
#   `reviewed_by` 는 아무것도 보증하지 않는다. 서명이 리비전에 묶이므로 45건 전부의
#   `reviewed_revision` 이 4 로 올랐다.
#   ⚠ 규칙은 대리자다: 토큰이 본문에 있다는 것과 그 문서가 질문에 답한다는 것은 같지 않다.
#   따라서 게이트는 **아직 닫히지 않는다**(gold 후보 18건이 미판정으로 남는다). 닫으려면
#   블라인드 풀 판정이 선행 조건이고, 그것은 별도 단위다. `cites_gold` 는 안 움직였다.

# revision 3 — 2026-08-13 검토·서명. 3런 처분(§6.3)에서 **내 라벨 결함**으로 판정한 두 건을
#   질의에 맞춰 고쳤다. 근거는 세 검증이다: 새 요구가 gold 본문에서 성립하고, **이미 옳았던
#   답변(r7)이 통과하며**, 무관한 문서에서는 탈락한다. 옛 요구로는 그 옳은 답변이 떨어졌다 —
#   라벨이 결함이었다는 증거가 그것이다.
#   q017 "어떤 파드부터 쫓겨나나": [축출]+[임계값|신호] → [BestEffort]+[우선순위|요청량].
#     축출 신호는 다른 질문이었다. 그리고 `축출` 은 질의 어휘를 되풀이하면 통과하므로 뺐다.
#   q039 "어떤 기준으로 고르나": [IngressClass|기본] → [설명서|문서]+[검토|다르게 작동].
#     기본 클래스 지정은 선택 기준이 아니다. 문서의 실제 기준은 "컨트롤러마다 다르게 작동하니
#     각 설명서를 검토하라" 다.

