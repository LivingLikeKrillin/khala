# 형식 요청 자 — 사용자가 "세 줄로" 라고 했을 때 답이 세 줄인가
# (SPEC-nexus-multi-turn-narration §5.2, U1)
#
# **이 파일은 커밋한다.** 코퍼스는 공개 쿠버네티스 한국어 문서(`tests/eval/ko/corpus/`)이므로
# 체크아웃 + Postgres + 임베딩 + LLM 만 있으면 누구나 재현한다.
#
# ── 무엇을 재는가 ───────────────────────────────────────────────────────────────
# 재작성 단계는 "검색과 무관한 요청" 을 질의에서 뺀다(검색 SPEC §3.2 변형 #2). 검색 질의로서는
# 옳지만, 떼어낸 요청이 **아무 데도 전달되지 않아** 답변자는 그 말을 들은 적이 없다.
#
# 그래서 각 행은 (1턴 질문, 형식 요청이 붙은 2턴 질문, 기계 판정 유형) 이다. 판정은 전부
# 문자열 연산이다(`nexus/search/format_compliance.py`) — LLM 판정자를 쓰면 자가 흔들린다.
#
# ── 대조군 ─────────────────────────────────────────────────────────────────────
# `control: true` 행은 **형식 요청이 없는** 후속 질문이다. 이것이 없으면 U2 가 개선인지 그냥
# 변화인지 못 가른다. 대조군은 형식 준수를 안 재고, **오늘과 같은 답이 나오는지**를 본다.
#
# ── 한계 ───────────────────────────────────────────────────────────────────────
# 형식 요청을 전달해도 **모델이 지킨다는 보장은 없다.** 이 자가 재는 것이 정확히 그 준수율이고,
# U2 이전 값이 베이스라인이다. 판정 규칙은 SPEC §5.3 에 **구현 전에** 등록됐다.
#
# revision 1 — 2026-08-13 저술.

