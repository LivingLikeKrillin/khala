# 2회차 — **비교 규칙**. 1회차와 질문이 겹치지 않는다(가설이 그 데이터에서 나왔으므로).
#
# 측정 전에 쓴다. 점수를 본 뒤 질문·기대값·규칙을 고치지 않는다.
revision: 1
rule: comparison                  # 스크립트가 이 값으로 판정 방식을 고른다
authored_by: assistant            # ⚠ 17건 전부 저자가 지었다. 실사용 질문이 아니다.
authored_at: "2026-08-25"
based_on: "1회차(PR #304) — 순차 게이트가 도구 질문 3건을 도구팔에 도달시키지 못했다"

# 판정 규칙 (자유 파라미터 0개):
#   1. 두 팔 모두 Confidence.weak  → none      (지금의 "제가 아는 것은…" 카드 자리)
#   2. 그 외에는 벡터거리가 **더 가까운 팔**   (여유값 없음. margin=0 — 새 문턱을 만들지 않는다)
#   거리만 판정에 쓴다. BM25 는 읽기용으로 기록만 한다.
#
# 차단 사유 (하나라도 걸리면 이 형태는 방아쇠로 못 쓴다):
#   · B군(같은 어휘·다른 필요) 또는 C군에서 도구가 뜨는 것 = 오선택.
#     오탐의 대가가 '한 줄' 이 아니라 **외부 호출**이 되기 때문이다.
#   A군 미선택(docs/none 으로 감)은 **안전한 실패**로 센다 — 지금과 같은 답이 나갈 뿐이다.

questions:
  # ── A. 도구가 필요하다. 그런데 그 **주제를 다루는 문서는 존재한다** (1회차가 걸린 자리) ──
  - {id: a1, q: "운영 mysql 컨테이너 지금 살아 있어?",        expect: "tool:deploy-status"}
  - {id: a2, q: "스테이징에 지금 뭐가 올라가 있어?",           expect: "tool:deploy-status"}
  - {id: a3, q: "지난 한 시간 동안 5xx 몇 건이야?",            expect: "tool:log-query"}
  - {id: a4, q: "요즘 제일 많이 찍히는 예외가 뭐야?",          expect: "tool:log-query"}
  - {id: a5, q: "운영에 지금 올라가 있는 버전이 뭐지?",        expect: "tool:deploy-history"}
  - {id: a6, q: "최근에 롤백한 적 있어?",                      expect: "tool:deploy-history"}

  # ── B. 근접 대조군 — **같은 어휘, 다른 필요**(절차·구성). 여기서 도구가 뜨면 차단 ──────
  - {id: b1, q: "배포는 어떻게 하는 거야?",                    expect: docs}
  - {id: b2, q: "로그에 어떤 필드가 들어가?",                  expect: docs}
  - {id: b3, q: "스테이징 환경 구성이 어떻게 돼?",             expect: docs}
  - {id: b4, q: "배포하기 전에 뭘 확인해야 해?",               expect: docs}
  - {id: b5, q: "터널이랑 Access는 왜 필요한 거야?",           expect: docs}

  # ── C. ops 와 무관한 문서 질문 ────────────────────────────────────────────────
  - {id: c1, q: "파티 목록 개설 정책이 어떻게 돼?",            expect: docs}
  - {id: c2, q: "프로필 아바타 정책 알려줘",                   expect: docs}
  - {id: c3, q: "이용약관에서 최근에 바뀐 게 뭐야?",           expect: docs}

  # ── D. 코퍼스 밖 ──────────────────────────────────────────────────────────────
  - {id: d1, q: "오늘 부산 미세먼지 어때?",                    expect: none}
  - {id: d2, q: "지금 카카오 주가 얼마야?",                    expect: none}
