# 도구 선택 실험 — 질문 세트와 기대값. **측정 전에 쓰고, 점수를 본 뒤 고치지 않는다.**
#
# expect:
#   tool:<이름>  이 질문은 그 도구가 답해야 한다
#   docs         문서가 답한다 — 도구를 고르면 오선택이다
#   none         아무것도 답할 수 없다 — 지금의 "제가 아는 것은…" 카드가 정답이다
revision: 1
authored_by: assistant            # ⚠ 13건 전부 내가 지었다. 실사용 질문이 아니다.
authored_at: "2026-08-24"

questions:
  # ── 도구가 답해야 하는 것 ────────────────────────────────────────────────
  - id: t1
    q: "지금 운영에 어떤 서비스가 떠 있어?"
    expect: tool:deploy-status
  - id: t2
    q: "스테이징에 레디스 살아 있나?"
    expect: tool:deploy-status
  - id: t3
    q: "어제 결제 관련 에러 몇 번 났어?"
    expect: tool:log-query
  - id: t4
    q: "로그인 실패 로그가 요즘 얼마나 자주 나와?"
    expect: tool:log-query
  - id: t5
    q: "마지막 배포가 언제였지?"
    expect: tool:deploy-history
  - id: t6
    q: "이번 주에 배포 몇 번 했어?"
    expect: tool:deploy-history

  # ── 문서가 답하는 것 (오선택 대조군) ─────────────────────────────────────
  # 이 넷에서 도구가 뜨면 그 형태는 방아쇠로 못 쓴다 — 오탐이 곧 외부 호출이기 때문이다.
  - id: d1
    q: "파티룸 신고 처리 절차 알려줘"
    expect: docs
  - id: d2
    q: "로그인 정책이 어떻게 돼?"
    expect: docs
  - id: d3
    q: "왜 서비스이름이 칼라인거지?"
    expect: docs
  - id: d4
    q: "개인정보 처리방침에서 뭐가 바뀌었어?"
    expect: docs

  # ── 아무것도 답할 수 없는 것 ─────────────────────────────────────────────
  - id: n1
    q: "오늘 서울 날씨 알려줘"
    expect: none
  - id: n2
    q: "근처 점심 맛집 추천해줘"
    expect: none
  - id: n3
    q: "지금 환율 얼마야?"
    expect: none
