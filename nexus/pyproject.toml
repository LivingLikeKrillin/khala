[project]
name = "nexus"
version = "0.1.0"
description = "Enterprise RAG + GraphRAG - grounded knowledge retrieval with Korean NLP + OTel integration"
requires-python = ">=3.11"
readme = "README.md"

# Every requirement carries an upper bound at the next major above the version we test
# (0.x bounds at <1). constraints.txt is what keeps CI on a fixed set; these bounds are
# what keep a fresh `pip install` outside CI off an incompatible major. See CONVENTIONS.md.
dependencies = [
    # Web framework
    "fastapi>=0.115.0,<1",
    "uvicorn[standard]>=0.32.0,<1",
    "python-multipart>=0.0.12,<1",
    # CLI
    "typer[all]>=0.12.0,<1",
    # Database
    "asyncpg>=0.30.0,<1",
    "pgvector>=0.3.0,<1",
    # Korean NLP
    "mecab-python3>=1.0.9,<2",
    # HTTP client (Ollama, Tempo)
    "httpx>=0.27.0,<1",
    # LLM
    "anthropic>=0.39.0,<1",
    # Utilities
    "pyyaml>=6.0,<7",
    "pydantic>=2.9.0,<3",
    "pydantic-settings>=2.6.0,<3",
    "tiktoken>=0.8.0,<1",
    "python-frontmatter>=1.1.0,<2",
    # structlog is CalVer — the year is the major, and it does break across years.
    # <27 makes next year's bump a deliberate one.
    "structlog>=24.4.0,<27",
    # Archon — 코드 구조 분석(권한 게이트 추출) via AST (무료, CodeQL 대체)
    "tree-sitter>=0.21,<1",
    "tree-sitter-java>=0.21,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<10",
    # The declared floor predates pytest-asyncio 1.0; we have been testing on 1.x for a
    # while without saying so. The floor is left alone, the bound stops the next major.
    "pytest-asyncio>=0.24.0,<2",
    "pytest-cov>=6.0.0,<8",
    "ruff>=0.8.0,<1",
]
slack = [
    "slack-bolt[async]>=1.20.0,<2",
    "slack-sdk>=3.33.0,<4",
]
mcp = [
    # Migrated to the 2.x API: `mcp.server.fastmcp.FastMCP` -> `mcp.server.MCPServer`.
    # 2.x requires Python >=3.10, so the 3.11 image and 3.13 CI are both fine.
    "mcp[cli]>=2.0.0,<3",
]
notion = [
    # S4 Notion importer — lazy-imported by NotionSource; off by default.
    # notion-client went 2.x -> 3.x without anything here declaring it; <4 stops the next one.
    "notion-client>=2.2.0,<4",
]
a2a = [
    # A2A (Agent2Agent) Phase 0 spike — pinned to the A2A v1.0 SDK build.
    # Off by default; only the `nexus/a2a/` surface imports it (flag-gated).
    "a2a-sdk==1.1.0",
]

[project.scripts]
nexus = "nexus.cli:app"
nexus-slack = "nexus.slack.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Pinned explicitly, not inherited from ruff's default. The default is not a fixed set:
# ruff 0.16 widened it to include I/B/S/UP/RUF/SIM/..., which turned 301 findings loose
# across the repo the moment the lint job started running. This is the set the code
# actually passes — the same one ruff's default meant before 0.16.
#
# Note this is narrower than the root ruff.toml's ["E", "F"], which also enables E501.
# Adopting E501 here costs 64 line rewrites repo-wide; that is a separate cleanup.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: 실제 DB 연결이 필요한 통합 테스트 (NEXUS_TEST_DB_URL 필요)",
]
