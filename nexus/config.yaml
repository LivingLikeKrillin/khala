# Nexus Configuration

# 문서 소스
sources:
  docs_path: "./docs"                    # 인덱싱할 문서 폴더
  glob_pattern: "**/*.md"                # Markdown만

# Classification 규칙 (순서대로 평가, 먼저 매치된 것 우선)
path_rules:
  - pattern: "**/security/**"
    classification: RESTRICTED
  - pattern: "**/credentials/**"
    classification: RESTRICTED
  - pattern: "**/secrets/**"
    classification: RESTRICTED
  - pattern: "**/public/**"
    classification: PUBLIC

file_type_rules:
  - extensions: [".rego", ".pem", ".key", ".crt", ".env"]
    classification: RESTRICTED

# PII/Secret 패턴 (정규식)
pii_patterns:
  aws_key: 'AKIA[0-9A-Z]{16}'
  jwt: 'eyJ[A-Za-z0-9\-_]+\.eyJ[A-Za-z0-9\-_]+\.[A-Za-z0-9\-_.+/=]+'
  credit_card: '\b[0-9]{4}[- ]?[0-9]{4}[- ]?[0-9]{4}[- ]?[0-9]{4}\b'
  korean_ssn: '\b[0-9]{6}-[1-4][0-9]{6}\b'

# Chunking
chunking:
  korean_tokens: 1100          # 한국어 문서 목표 토큰 수
  english_tokens: 700          # 영어 문서 목표 토큰 수
  overlap_ratio: 0.15          # 오버랩 비율

# Embedding
embedding:
  # 세대는 셋이 함께 움직인다: model · search.embedding_column · backend.
  # 배포는 이 파일이 아니라 env 로 움직인다(NEXUS_EMBEDDING_MODEL / NEXUS_EMBEDDING_COLUMN /
  # NEXUS_EMBEDDING_BACKEND) — 이 파일은 워킹트리에서 읽히므로 여기서 flip 하면 git 이 되돌린다.
  # (SPEC-nexus-embedding-cutover-seam §4.2)
  model: "nomic-embed-text"
  backend: "ollama"                     # ollama | sidecar — 모델이 어디서 서빙되는가
  # dimensions 도, 지시문(document_prefix/query_prefix)도 여기 없다. 둘 다 **모델의 사실**이라
  # MODEL_DIMENSIONS / MODEL_PREFIXES 가 갖는다. 여기 적으면 모델을 바꿀 때 함께 안 바뀌고,
  # 그러면 그 모델을 잘못 쓴 결과를 재게 된다 — 실제로 컷오버 당일 이 두 줄(nomic 형식)이 남아
  # 있어서 KURE 로 전환한 앱이 부팅을 거부했다(2026-08-05, 가드가 의도대로 막았다).
  # 특수한 배포가 굳이 덮어써야 하면 여기에 키를 넣을 수 있고, 모델 카드와 모순되면 기동이 막힌다.
  batch_size: 10
  max_retries: 3

# Search
index:
  # 벡터를 **일부러** 안 만드는 테넌트 (SPEC-nexus-index-completeness §3.3). 고정된 비교 코퍼스가
  # 그렇다. 선언하지 않으면 이들이 매 기동마다 error 를 뱉고, 진짜 신호가 그 사이에 묻힌다 —
  # 2026-08-10 에 51개 청크가 그렇게 하루를 지나갔다. 추론하지 않는 이유는 §3.3 에 있다.
  coverage_exempt_tenants: [ko_eval_arm, ko_eval_packb]

search:
  bm25_top_k: 25
  vector_top_k: 20
  rrf_k: 60                    # RRF fusion 파라미터
  final_top_k: 10              # 최종 반환 수
  # top-k 내 한 문서 최대 청크 수(문서 도배 방지, SPEC-nexus-ranking-precision).
  #
  # **3 → 5 (2026-08-18, 실측 근거).** 3 은 답이 한 문서의 여러 절에 흩어진 코퍼스에서 정답을
  # 담은 청크를 잘라냈다: 라이브 정책 코퍼스 8질의 중 2건(로그인 유형별 상한·자동 스킵 규칙)에서
  # 그 청크가 상위 10에 **아예 못 들어왔고**, 상한 5면 8/8 들어온다. 문서 단위 Recall(8/8)로는
  # 안 보이는 손실이다 — 정답 문서는 늘 1위였고 빠진 것은 그 안의 절이었다.
  #
  # 답변까지 3런씩 재면 정답 6.3/8 → 7.7/8 이고, 상한 3 의 **유일한 지속 실패(3/3)가 사라진다.**
  # 대가는 상위 10의 평균 문서 수 6.0 → 5.0 이며, 그 손해가 결과로 나타난 적은 없다(정답 문서
  # 인용은 모든 상한에서 8/8).
  #
  # ⚠ 이 자에는 **다양성이 실제로 필요한 질문**(두 번째 문서가 밀려나면 답이 나빠지는 경우)이
  # 없다. 그런 유형이 라벨에 들어오면 이 값을 다시 재라. CI 리콜 바닥값은 융합 이전 단계
  # (`_bm25_search`)를 재므로 이 값에 영향받지 않는다.
  diversity_per_doc_cap: 5
  # 상한을 꽉 채운 문서의 **남은 절**을 근거에 채운다 (`search/section_fill.py`).
  # 검색은 '어느 문서' 를 맞히고 '어느 절' 을 틀린다 — 질문과 정답 절이 어휘를 안 나누면 어떤
  # 랭킹으로도 못 간다. 순위는 안 건드리고 근거만 는다(단일홉 평가에서 +22%, 해는 관측 안 됨).
  # 코드 기본값은 꺼짐이다: 설정 없는 호출부가 DB 를 새로 치지 않게 하려는 것이다.
  section_fill: true
  # 정정 확인 패스 — 1차 근거가 부른 이름에 변경 어휘를 붙여 한 번 더 검색한다
  # (`search/reconcile.py`). **정정당한 문서가 정정한 문서를 이기는 것**을 막는다.
  # 측정 2026-08-29: 처치 대상 라벨 0/5 → 3/5, 대조군 무해, 검색 300 → 1,065 ms.
  # 코드 기본값은 꺼짐이고 답변 경로에만 걸린다 — 검색만 하는 경로에서는 그 3.5배가
  # 그대로 사용자에게 보인다.
  reconcile_pass: true
  # 짝 문서 확장 — 설계(`specs/`)와 구현 계획(`plans/`)은 같은 일의 두 문서이고, 파일
  # 이름으로 이어진다(라이브 27쌍). 측정 2026-08-29: 처치 라벨 0/5 → 4/5, 대조군 셋 5/5 유지,
  # 지연 +3 ms, **근거 분량 +26~134%**. 값이 붙는 곳은 짝이 있는 코퍼스뿐이다.
  pair_expansion: true
  # 코드의 현재 값 — 질문에 걸린 claim 을 코드에서 다시 읽어 근거에 **문서와 나란히** 붙인다
  # (`claims/matching.py` · `search/reconcile.py`). 문서 30자 vs 서버 `@Size(max = 100)` 처럼
  # 갈리는 자리가 실물에 있고, 어느 쪽이 맞는지는 시스템이 판정하지 않는다 — 둘 다 보인다.
  # claim 이 파일을 알고 있으므로 그 파일만 읽는다(트리 훑기는 이 배포에서 50.7초다).
  # 코드 기본값은 꺼짐이고, claim 이 안 걸리면 프롬프트는 오늘과 바이트 단위로 같다.
  code_values: true
  snippet_max_chars: 300       # 근거 스니펫 최대 길이(문장 경계에서 컷, SPEC-nexus-snippet-boundary-truncation)
  # 어느 임베딩 세대를 읽을지 (SPEC-nexus-kure-embedding-swap §4.2). 컷오버도 롤백도 이 값 하나다.
  # embedding=nomic-embed-text(768) · embedding_1024=KURE-v1(1024). 화이트리스트 밖이면 기동 실패.
  embedding_column: embedding

# 단계별 span (SPEC-nexus-stage-spans, Unit 1)
#
# ⛔ **기본이 꺼짐이다.** 캡처는 요청마다 순위 매겨진 후보 목록을 쌓는데, 그것은 질의의
# 지문이고 테넌트 구성·시각·principal 과 상관된다. 그 위험을 묶는 보존 창이 정해지기 전에
# 쌓기 시작하면 안 된다. 켜는 것은 별개의 명시적 행위다.
spans:
  enabled: false
  # 소유자 결정: 되돌릴 수 있는 쪽. 창은 나중에 넓힐 수 있지만 버린 행은 못 되살린다.
  candidate_retain_days: 3
  # 한 span 의 후보 행 상한. diversify 는 **면제** — 잘린 행이 곧 진단 자료라
  # 입력 순위로 자르면 정확히 그것을 버린다.
  max_candidates_per_span: 100

# LLM 단가 — 비용 추적(SPEC-nexus-llm-usage-capture). USD per 1M tokens, 운영자 관리.
# 키는 NEXUS_LLM_MODEL 값과 일치해야 함(없거나 불완전하면 cost=None, 지어내지 않음).
llm:
  pricing:
    claude-sonnet-4-6:
      input_per_mtok: 3.0
      output_per_mtok: 15.0

# 근거 신선도(SPEC-nexus-answer-staleness-warning) — doc_type 별 TTL(일). 나이 > TTL → stale 경고.
# updated_at(적재시각) 기준(적재≠검토, 보수적 하한). null = 무제한(never stale). default = 미분류(wiki/markdown 등).
staleness:
  ttl_days:
    ADR: 365
    DESIGN: 365
    RFC: 365
    PRD: 180
    RUNBOOK: 90
    POSTMORTEM: 180
    NOTE: 730
    default: 365

# Graph
graph:
  max_hops: 2
  relation_types:
    - CALLS
    - PUBLISHES
    - SUBSCRIBES

# Graph extraction triggers (한국어 + 영어)
extraction_triggers:
  CALLS:
    ko: ["호출한다", "호출하는", "요청한다", "요청하는", "연동", "통신"]
    en: ["calls", "invokes", "requests", "connects to"]
  PUBLISHES:
    ko: ["발행한다", "발행하는", "전송한다", "보낸다", "publish"]
    en: ["publishes", "emits", "sends", "produces"]
  SUBSCRIBES:
    ko: ["구독한다", "구독하는", "수신한다", "받는다", "consume"]
    en: ["subscribes", "consumes", "listens", "receives"]

# OTel
otel:
  window_minutes: 5
  default_lookback_minutes: 60

# Evidence weights
evidence_weights:
  STRUCTURED_SPEC: 0.30
  POLICY_CONFIG: 0.25
  OBSERVATION: 0.25
  DESIGN_DOC: 0.15
  MEETING_NOTE: 0.05

# LLM
# ⚠️ 이 섹션은 코드가 읽지 않는다. LLMService() 는 인자 없이 생성되어(api.py) 모델을
#    NEXUS_LLM_MODEL 환경변수 → 코드 기본값(claude-sonnet-4-6) 순으로 정하고, max_tokens 는
#    호출부 기본값(4096)을 쓴다. 모델을 바꾸려면 nexus/.env 의 NEXUS_LLM_MODEL 한 줄을 바꾼다.
#    (여기 있던 claude-sonnet-4-20250514 는 2026-06-15 EOL 이라, 읽혔다면 404 를 냈을 값이다.)

# Archon — 도메인 불변식·값 거버넌스 (코드 상수 해석)
code_source:
  repo_path: "/code-src"   # 대상 코드 checkout 경로 (예: .../sample-app). 비면 값 조회 비활성.

# ── Auth (identity layer) ──
# Binds a bearer token to a fixed (tenant, clearance). Callers can only NARROW scope.
# mode: enforced (default, fail-closed) | permissive (explicit dev/local opt-out; anonymous=PUBLIC)
# Generate a token:  nexus auth gen-token | nexus auth hash-token  -> paste below.
# Enforced boot is REFUSED while any token_sha256 is still "REPLACE_ME".
auth:
  mode: enforced
  allowed_origins:
    - "http://localhost:8000"
  principals: []
    # - name: "analyst"
    #   token_sha256: "REPLACE_ME"
    #   tenant: "default"
    #   clearance: "INTERNAL"

  # ── Cloudflare Access (per-person browser identity) — OFF by default ──
  # 설정하면 Nexus 는 자신이 Access 뒤에 있다고 선언한다: Cf-Access-Jwt-Assertion 헤더를
  # 검증하고 email 로 principal 을 고른다. 그리고 공유 dev-token 경로는 꺼진다(SPEC §4.5).
  # issuer/aud 는 Zero Trust 대시보드에서 온다. 없으면 이 섹션을 통째로 비워 둔다(로컬 dev).
  # access:
  #   issuer: "https://<team>.cloudflareaccess.com"
  #   aud: "<application-audience-tag>"
  #   default_identity:            # Access 는 통과했으나 매핑에 없는 email 의 기본 신원.
  #     clearance: "PUBLIC"        # capabilities 는 항상 비어 있다(파괴적 행위 불가).
  #   identities:
  #     "alice@example.com":
  #       clearance: "INTERNAL"
  #       capabilities: ["manage_sources", "manage_documents"]

# ── A2A (Agent2Agent) Phase 0 spike — OFF by default ──
# Flag-gated grounded-retrieval server (SPEC-nexus-a2a-server-phase0-spike). Enable with
# NEXUS_A2A_ENABLED=1 (or `enabled: true`). The Agent Card is public; skill execution is
# token-gated. One token => one fixed (tenant, clearance), narrow-only (same identity model
# as `auth`). Env single-token: NEXUS_A2A_TOKEN / NEXUS_A2A_TENANT / NEXUS_A2A_CLEARANCE.
a2a:
  enabled: false
  base_url: "http://localhost:8000"
  # External A2A caller origins (Phase 2). Unioned into the app CORS when enabled; never "*".
  # Leave empty to inherit auth.allowed_origins. Every A2A task (grant/deny) is audited
  # (structlog event "a2a.audit"; query is hashed, never logged verbatim).
  allowed_origins: []
  principals: []
    # - name: "ext-agent"
    #   token_sha256: "REPLACE_ME"   # nexus auth gen-token | nexus auth hash-token
    #   tenant: "default"
    #   clearance: "INTERNAL"
    #   # Phase 3: grant the write skill (ingest_governed_doc). Omit for read-only tokens.
    #   capabilities: ["ingest_governed"]
