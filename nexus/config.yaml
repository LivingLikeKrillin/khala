# Nexus Configuration

# 문서 소스
sources:
  docs_path: "./docs"                    # 인덱싱할 문서 폴더
  glob_pattern: "**/*.md"                # Markdown만

# Classification 규칙 (순서대로 평가, 먼저 매치된 것 우선)
path_rules:
  - pattern: "**/security/**"
    classification: RESTRICTED
  - pattern: "**/credentials/**"
    classification: RESTRICTED
  - pattern: "**/secrets/**"
    classification: RESTRICTED
  - pattern: "**/public/**"
    classification: PUBLIC

file_type_rules:
  - extensions: [".rego", ".pem", ".key", ".crt", ".env"]
    classification: RESTRICTED

# PII/Secret 패턴 (정규식)
pii_patterns:
  aws_key: 'AKIA[0-9A-Z]{16}'
  jwt: 'eyJ[A-Za-z0-9\-_]+\.eyJ[A-Za-z0-9\-_]+\.[A-Za-z0-9\-_.+/=]+'
  credit_card: '\b[0-9]{4}[- ]?[0-9]{4}[- ]?[0-9]{4}[- ]?[0-9]{4}\b'
  korean_ssn: '\b[0-9]{6}-[1-4][0-9]{6}\b'

# Chunking
chunking:
  korean_tokens: 1100          # 한국어 문서 목표 토큰 수
  english_tokens: 700          # 영어 문서 목표 토큰 수
  overlap_ratio: 0.15          # 오버랩 비율

# Embedding
embedding:
  model: "nomic-embed-text"
  dimensions: 768
  document_prefix: "search_document: "  # nomic 모델 규칙
  query_prefix: "search_query: "        # nomic 모델 규칙
  batch_size: 10
  max_retries: 3

# Search
search:
  bm25_top_k: 20
  vector_top_k: 20
  rrf_k: 60                    # RRF fusion 파라미터
  final_top_k: 10              # 최종 반환 수
  diversity_per_doc_cap: 3     # top-k 내 한 문서 최대 청크 수(문서 도배 방지, SPEC-nexus-ranking-precision)
  snippet_max_chars: 300       # 근거 스니펫 최대 길이(문장 경계에서 컷, SPEC-nexus-snippet-boundary-truncation)

# Graph
graph:
  max_hops: 2
  relation_types:
    - CALLS
    - PUBLISHES
    - SUBSCRIBES

# Graph extraction triggers (한국어 + 영어)
extraction_triggers:
  CALLS:
    ko: ["호출한다", "호출하는", "요청한다", "요청하는", "연동", "통신"]
    en: ["calls", "invokes", "requests", "connects to"]
  PUBLISHES:
    ko: ["발행한다", "발행하는", "전송한다", "보낸다", "publish"]
    en: ["publishes", "emits", "sends", "produces"]
  SUBSCRIBES:
    ko: ["구독한다", "구독하는", "수신한다", "받는다", "consume"]
    en: ["subscribes", "consumes", "listens", "receives"]

# OTel
otel:
  window_minutes: 5
  default_lookback_minutes: 60

# Evidence weights
evidence_weights:
  STRUCTURED_SPEC: 0.30
  POLICY_CONFIG: 0.25
  OBSERVATION: 0.25
  DESIGN_DOC: 0.15
  MEETING_NOTE: 0.05

# LLM
# ⚠️ 이 섹션은 코드가 읽지 않는다. LLMService() 는 인자 없이 생성되어(api.py) 모델을
#    NEXUS_LLM_MODEL 환경변수 → 코드 기본값(claude-sonnet-4-6) 순으로 정하고, max_tokens 는
#    호출부 기본값(4096)을 쓴다. 모델을 바꾸려면 nexus/.env 의 NEXUS_LLM_MODEL 한 줄을 바꾼다.
#    (여기 있던 claude-sonnet-4-20250514 는 2026-06-15 EOL 이라, 읽혔다면 404 를 냈을 값이다.)

# Archon — 도메인 불변식·값 거버넌스 (코드 상수 해석)
code_source:
  repo_path: ""   # 대상 코드 checkout 경로 (예: .../sample-app). 비면 값 조회 비활성.

# ── Auth (identity layer) ──
# Binds a bearer token to a fixed (tenant, clearance). Callers can only NARROW scope.
# mode: enforced (default, fail-closed) | permissive (explicit dev/local opt-out; anonymous=PUBLIC)
# Generate a token:  nexus auth gen-token | nexus auth hash-token  -> paste below.
# Enforced boot is REFUSED while any token_sha256 is still "REPLACE_ME".
auth:
  mode: enforced
  allowed_origins:
    - "http://localhost:8000"
  principals: []
    # - name: "analyst"
    #   token_sha256: "REPLACE_ME"
    #   tenant: "default"
    #   clearance: "INTERNAL"

  # ── Cloudflare Access (per-person browser identity) — OFF by default ──
  # 설정하면 Nexus 는 자신이 Access 뒤에 있다고 선언한다: Cf-Access-Jwt-Assertion 헤더를
  # 검증하고 email 로 principal 을 고른다. 그리고 공유 dev-token 경로는 꺼진다(SPEC §4.5).
  # issuer/aud 는 Zero Trust 대시보드에서 온다. 없으면 이 섹션을 통째로 비워 둔다(로컬 dev).
  # access:
  #   issuer: "https://<team>.cloudflareaccess.com"
  #   aud: "<application-audience-tag>"
  #   default_identity:            # Access 는 통과했으나 매핑에 없는 email 의 기본 신원.
  #     clearance: "PUBLIC"        # capabilities 는 항상 비어 있다(파괴적 행위 불가).
  #   identities:
  #     "eisen@pfplay.com":
  #       clearance: "INTERNAL"
  #       capabilities: ["manage_sources", "manage_documents"]

# ── A2A (Agent2Agent) Phase 0 spike — OFF by default ──
# Flag-gated grounded-retrieval server (SPEC-nexus-a2a-server-phase0-spike). Enable with
# NEXUS_A2A_ENABLED=1 (or `enabled: true`). The Agent Card is public; skill execution is
# token-gated. One token => one fixed (tenant, clearance), narrow-only (same identity model
# as `auth`). Env single-token: NEXUS_A2A_TOKEN / NEXUS_A2A_TENANT / NEXUS_A2A_CLEARANCE.
a2a:
  enabled: false
  base_url: "http://localhost:8000"
  # External A2A caller origins (Phase 2). Unioned into the app CORS when enabled; never "*".
  # Leave empty to inherit auth.allowed_origins. Every A2A task (grant/deny) is audited
  # (structlog event "a2a.audit"; query is hashed, never logged verbatim).
  allowed_origins: []
  principals: []
    # - name: "ext-agent"
    #   token_sha256: "REPLACE_ME"   # nexus auth gen-token | nexus auth hash-token
    #   tenant: "default"
    #   clearance: "INTERNAL"
    #   # Phase 3: grant the write skill (ingest_governed_doc). Omit for read-only tokens.
    #   capabilities: ["ingest_governed"]
