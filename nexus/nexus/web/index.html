<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus — Khala</title>

  <!-- Fonts (self-hosted — Pretendard KR body · Sora display · JetBrains Mono metrics) -->
  <link rel="preload" href="/static/vendor/fonts/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/vendor/fonts.css">

  <!-- Libraries (self-hosted — no CDN, air-gap safe) -->
  <script src="/static/vendor/js/marked.min.js"></script>
  <script src="/static/vendor/js/purify.min.js"></script>
  <script src="/static/vendor/js/vis-network.min.js"></script>
  <link rel="stylesheet" href="/static/vendor/css/vis-network.min.css">

  <!-- App -->
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <!-- Ambient psionic void — fixed atmosphere behind everything -->
  <div class="void-bg" aria-hidden="true">
    <div class="void-glow void-glow-crystal"></div>
    <div class="void-glow void-glow-deep"></div>
    <div class="void-grid"></div>
  </div>

  <!-- Console Header -->
  <header id="status-bar">
    <div class="status-left">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="22" height="22">
          <defs>
            <linearGradient id="hdr-crystal" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#c7f1ff"/>
              <stop offset="55%" stop-color="#4fb6ee"/>
              <stop offset="100%" stop-color="#2272c4"/>
            </linearGradient>
          </defs>
          <path d="M30 24 C24 18 23 12 27.5 7" fill="none" stroke="#8fdcff" stroke-width="2.4" stroke-linecap="round" opacity="0.8"/>
          <path d="M34 24 C40 18 41 12 36.5 7" fill="none" stroke="#8fdcff" stroke-width="2.4" stroke-linecap="round" opacity="0.8"/>
          <path d="M32 19 L41 36 L32 50 L23 36 Z" fill="url(#hdr-crystal)"/>
          <path d="M32 19 L32 50 L23 36 Z" fill="#ffffff" opacity="0.18"/>
          <path d="M32 19 L41 36 L32 36 Z" fill="#ffffff" opacity="0.32"/>
        </svg>
      </span>
      <h1 class="logo">Nexus</h1>
      <span class="brand-sep">/</span>
      <span class="brand-eyebrow">KHALA</span>
      <span class="status-text" id="status-text">연결 확인 중…</span>
    </div>
    <div class="status-right">
      <!-- ops/거버넌스 크롬은 Reader 표면(웹)에서 기본 숨김 — 서비스 연결 점·설계-관측
           불일치는 운영자 신호이지 Reader 관심사가 아니다(거버넌스 복잡도가 Reader 에게
           새면 사용성 위반). 가역적: 라우트·CLI·MCP 불변, 추후 Steward/운영자 표면에서 재노출. -->
      <div class="status-services hidden">
        <span class="status-dot" id="dot-db" title="Database"></span>
        <span class="status-dot" id="dot-ollama" title="Ollama"></span>
        <span class="status-dot" id="dot-tempo" title="Tempo"></span>
      </div>
      <span class="status-badge" id="badge-docs" title="인덱싱된 문서 수">0 문서</span>
      <span class="status-badge clickable hidden" id="badge-diff" title="설계-관측 불일치">0 불일치</span>
    </div>
  </header>

  <!-- Auth posture banner (shown only in permissive/anonymous mode) -->
  <div id="auth-banner" class="auth-banner hidden" role="status">
    <span class="auth-banner-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/>
      </svg>
    </span>
    <span>익명 모드 — 인증 토큰 없이 접속해 <strong>PUBLIC 문서만</strong> 표시됩니다. 공유·운영 환경에서는 토큰 인증을 사용하세요.</span>
  </div>

  <!-- Main Layout -->
  <div id="app-layout">
    <!-- Sidebar Navigation -->
    <nav id="sidebar">
      <a href="#/chat" class="nav-item active" data-view="chat" data-label="채팅">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5 8.5 8.5 0 0 1-3.8-.9L3 21l1.9-5.7a8.5 8.5 0 0 1-.9-3.8A8.38 8.38 0 0 1 12.5 3 8.38 8.38 0 0 1 21 11.5z"/>
          </svg>
        </span>
        <span class="nav-label">채팅</span>
      </a>
      <a href="#/graph" class="nav-item" data-view="graph" data-label="그래프">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="18" cy="5" r="2.6"/><circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="19" r="2.6"/>
            <path d="M8.3 10.8 15.7 6.2M8.3 13.2 15.7 17.8"/>
          </svg>
        </span>
        <span class="nav-label">그래프</span>
      </a>
      <a href="#/documents" class="nav-item" data-view="documents" data-label="문서">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>
            <path d="M9 13h6M9 17h6"/>
          </svg>
        </span>
        <span class="nav-label">문서</span>
      </a>
      <!-- Diff(설계-관측 불일치)는 운영자 도구 — Reader 표면에서 기본 숨김(라우트는 유지). -->
      <a href="#/diff" class="nav-item hidden" data-view="diff" data-label="Diff">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="6" cy="6" r="2.6"/><circle cx="18" cy="18" r="2.6"/>
            <path d="M6 8.6V14a4 4 0 0 0 4 4h5"/><path d="m13 13 2 2-2 2"/>
          </svg>
        </span>
        <span class="nav-label">Diff</span>
      </a>
      <a href="#/upload" class="nav-item" data-view="upload" data-label="업로드">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 14.9A6 6 0 1 1 15.7 8.5h1.3a4.5 4.5 0 0 1 1.6 8.7"/><path d="M12 12v8"/><path d="m8.5 15 3.5-3.5L15.5 15"/>
          </svg>
        </span>
        <span class="nav-label">업로드</span>
      </a>
    </nav>

    <!-- Main Content -->
    <main id="main-content"></main>
  </div>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <!-- App Scripts (ES Modules) -->
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
