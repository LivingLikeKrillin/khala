# 통합 테스트용 Docker Compose — 운영 인프라와 포트 충돌 방지
services:
  nexus-test-db:
    image: pgvector/pgvector:pg16
    container_name: nexus-test-db
    environment:
      POSTGRES_DB: nexus_test
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
    ports:
      - "5433:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      # 이 DB 만 TRUNCATE 를 허용한다. 마커가 없으면 스위트가 붙기를 거부한다.
      - ./tests/disposable_db.sql:/docker-entrypoint-initdb.d/02-disposable.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus_test"]
      interval: 3s
      timeout: 3s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data  # 테스트 데이터는 메모리에 (빠른 실행 + 자동 정리)
