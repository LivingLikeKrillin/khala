services:
  # ── PostgreSQL + pgvector ──
  nexus-db:
    image: pgvector/pgvector:pg16
    container_name: nexus-db
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
    ports:
      - "5432:5432"
    volumes:
      - nexus-db-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Ollama (embedding model) ──
  # 임베딩 사이드카 (SPEC-nexus-kure-embedding-swap §4.1). **기본으로 뜨지 않는다** —
  # `--profile embed` 를 줘야 뜬다. 유닛이 순서대로 들어오는 동안 각 조각은 다음 것이 오기 전까지
  # 비활성이어야 하고(§2), 2~3GB 이미지를 아무 이유 없이 모든 설치가 받게 할 이유도 없다.
  nexus-embed:
    build: ./embed_service
    container_name: nexus-embed
    profiles: ["embed"]
    ports:
      - "8080:8080"
    environment:
      EMBED_MODEL: KURE-v1
      EMBED_CHECKPOINT: nlpai-lab/KURE-v1
      # 리비전을 비워 두면 main 이 가리키는 무엇이든 받는다 — 같은 차원의 다른 체크포인트가
      # 경고 없이 섞인다. **핀은 컷오버 전에 박는다** (SPEC-nexus-embedding-cutover-seam §4.5):
      # 아래 값은 2026-08-04 에 이 배포가 실제로 받아 측정에 쓴 스냅샷의 커밋이다.
      EMBED_REVISION: ${EMBED_REVISION:-d14c8a9423946e268a0c9952fecf3a7aabd73bd9}
      EMBED_DEVICE: cpu
    volumes:
      - nexus-hf-cache:/hf
    healthcheck:
      # 적재에 ~9초. ready:false 를 healthy 로 보면 앱이 준비 안 된 서비스에 요청을 던진다.
      test: ["CMD-SHELL", "python -c \"import json,urllib.request,sys; sys.exit(0 if json.load(urllib.request.urlopen('http://localhost:8080/health'))['ready'] else 1)\""]
      interval: 5s
      timeout: 5s
      retries: 30

  nexus-ollama:
    image: ollama/ollama
    container_name: nexus-ollama
    ports:
      - "11434:11434"
    volumes:
      - nexus-ollama-data:/root/.ollama
    # GPU 사용 시 아래 주석 해제
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - capabilities: [gpu]

  # ── OTel Collector ──
  nexus-otel:
    image: otel/opentelemetry-collector:latest
    container_name: nexus-otel
    command: ["--config=/etc/otel/config.yaml"]
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    volumes:
      - ./otel-config.yaml:/etc/otel/config.yaml:ro
    depends_on:
      - nexus-tempo
    profiles:
      - observability   # 관측 파이프라인 — 기본 미기동(Reader Deploy 경량화). 옵트인: docker compose --profile observability up

  # ── Grafana Tempo (trace storage) ──
  nexus-tempo:
    image: grafana/tempo:latest
    container_name: nexus-tempo
    command: ["-config.file=/etc/tempo/config.yaml"]
    ports:
      - "3200:3200"   # Tempo query API
      - "4320:4317"   # OTLP gRPC (Tempo 직접)
    volumes:
      - ./tempo-config.yaml:/etc/tempo/config.yaml:ro
      - nexus-tempo-data:/var/tempo
    profiles:
      - observability
      - grafana   # grafana 프로필도 tempo 가 필요(depends_on)

  # ── Grafana (선택: trace 시각화) ──
  nexus-grafana:
    image: grafana/grafana:latest
    container_name: nexus-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - nexus-grafana-data:/var/lib/grafana
    depends_on:
      - nexus-tempo
    profiles:
      - grafana  # docker-compose --profile grafana up 으로 선택 기동

  # ── Nexus App ──
  nexus-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://nexus:nexus@nexus-db:5432/nexus
      OLLAMA_URL: http://nexus-ollama:11434
      TEMPO_URL: http://nexus-tempo:3200   # OTel 집계(nexus otel-aggregate) 시에만 사용 — 그 땐 --profile observability
      DEFAULT_TENANT: default
      # ── 자격증명 ──
      # 앱이 쓰는 시크릿은 **여기 한 곳**에서 주입한다. compose 는 이 파일 옆의 `.env` 를 읽어
      # 치환하므로 어떤 오버레이를 얹든 값이 따라온다. 오버레이에만 적으면 그 오버레이를 안
      # 얹는 배포(=prod)에서 조용히 사라진다 — NOTION_TOKEN 이 실제로 그랬다.
      # 기본값 빈 문자열: 토큰 없이도 부팅하고, 그 기능만 못 쓴다.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      NOTION_TOKEN: ${NOTION_TOKEN:-}
      # LLM 백엔드 선택(dev). 미설정이면 anthropic 기본 — 프로덕션 무영향.
      # claude-code = 호스트에서 도는 Claude Code 를 브리지 경유로 써서 키 없이 서술(`task llm-bridge`).
      NEXUS_LLM_PROVIDER: ${NEXUS_LLM_PROVIDER:-}
      NEXUS_LLM_BRIDGE_URL: ${NEXUS_LLM_BRIDGE_URL:-}
      NEXUS_LLM_BRIDGE_TOKEN: ${NEXUS_LLM_BRIDGE_TOKEN:-}
      # ── 임베딩 세대 (SPEC-nexus-embedding-cutover-seam §4.2) ──
      # 컷오버는 이 셋을 **함께** 움직이는 일이고, 배포는 `.env` 에서 움직인다.
      # 반드시 `${VAR:-default}` 보간이어야 한다 — 리터럴을 적으면 compose 값이 `.env` 를 이겨서
      # flip 이 "성공했다" 고 보고하면서 아무것도 안 바꾼다. 정합성 검사는 셋 다 옛 값이라 통과한다.
      NEXUS_EMBEDDING_MODEL: ${NEXUS_EMBEDDING_MODEL:-nomic-embed-text}
      NEXUS_EMBEDDING_COLUMN: ${NEXUS_EMBEDDING_COLUMN:-embedding}
      NEXUS_EMBEDDING_BACKEND: ${NEXUS_EMBEDDING_BACKEND:-ollama}
      # 사이드카는 프로파일 뒤에 있어 안 떠 있을 수 있다. depends_on 을 걸면 프로파일을 안 켠
      # 배포가 `depends on undefined service` 로 아예 죽는다(실측) — 없는 사이드카는 벡터 다리의
      # degrade 경로가 맡는다 (§4.4).
      EMBED_URL: ${EMBED_URL:-http://nexus-embed:8080}
    volumes:
      - .:/app                    # 개발 중 코드 변경 반영 (hot reload)
      - ./docs:/app/docs:ro       # 인덱싱할 문서 폴더
    depends_on:
      nexus-db:
        condition: service_healthy
      nexus-ollama:
        condition: service_started
      # nexus-otel/tempo 의존 제거 — 앱은 collector 에 접속하지 않는다(코드 미참조). 관측은 옵트인 profile.

  # Slack 봇 — opt-in. `docker compose --profile slack up -d` 로만 뜬다.
  # inbound 포트 없음(Socket Mode): 두 Slack 토큰으로 아웃바운드 연결만 연다 → 터널/도메인 불필요.
  # 세 토큰이 모두 있어야 뜬다. NEXUS_SLACK_TOKEN 이 없으면 nexus-slack 이 시동을 거부한다(401 루프 대신).
  nexus-slack:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-slack
    command: ["nexus-slack"]
    environment:
      NEXUS_API_URL: http://nexus-app:8000
      # Slack 앱 토큰(Socket Mode) — Slack 앱에서 발급.
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN:-}
      # Nexus bearer — nexus auth gen-token 으로 발급한 읽기 전용 principal. auth.slack.clearance 상한.
      NEXUS_SLACK_TOKEN: ${NEXUS_SLACK_TOKEN:-}
    depends_on:
      nexus-app:
        condition: service_started
    profiles:
      - slack

volumes:
  nexus-db-data:
  nexus-hf-cache:
  nexus-ollama-data:
  nexus-tempo-data:
  nexus-grafana-data:
