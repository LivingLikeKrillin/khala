- id: unembedded-chunks-not-recorded
  source: KOREAN_SEARCH_QUALITY.md §3.2
  owner: LivingLikeKrillin
  state: open
  what: >
    An embedding refusal is swallowed - index/embed.py returns False and embed_health counts only
    IS NOT NULL - so a chunk that the vector leg can never see is recorded nowhere.
  why_still_open: >
    Two of three are done. It is counted (GET /sources/notion/corpus reports unembedded_chunks
    against the column the search leg reads) and the refusal is now stored as a row with the
    backend's message verbatim (embed_refusals, cleared when a retry succeeds, kept separate from
