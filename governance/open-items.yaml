- id: packb-snapshot-form-deviation
  source: SPEC-nexus-korean-retrieval-eval §4.1
  owner: LivingLikeKrillin
  state: open
  what: >
    §4.1 defines Pack B as a local export carrying "document rid, title, text and content hash on
    disk". The implementation freezes a tenant snapshot instead - same rows, new rids, its own
    manifest - because Nexus keeps no original document text (principle 5: an index, not a store),
    so a disk export would have to be reconstructed from chunks and then re-chunked by load_pack,
    which changes what is being measured.
  why_still_open: >
    The reason §4.1 disqualified the live tenant was that it moves; a manifested snapshot answers
    that reason exactly. But the letter of an approved SPEC differs from the implementation, and a
    successor record is owed - the same shape as the clean-db deviation.
  trigger: The next ko-eval SPEC, or the first citation of Pack B's result.
  checked_by: human

- id: packb-corpus-substance
  source: KOREAN_SEARCH_QUALITY.md §6.2
  owner: LivingLikeKrillin
  state: closed
  closed_by: >
    Measured the same day, and the measurement went against the item. The threshold it records
    (>= 60 documents of >= 800 characters) rested on an inference that was never tested: that with
    19 gold candidates the two arms would meet over the same few documents and ties would pile up.
    That inference needed no labels to check - a discordant pair requires the two arms to return
    different rankings, and whether they do is measurable on its own.

    With nori swapped in as a tokenizer only (same engine, scorer and part-of-speech policy) over
    30 probe queries: 48 of 116 documents surface in some top ten, orderings diverge on 12 of 30
    queries, and 8 of those diverge at rank 2 or 3 - shallow enough that a gold sitting there
    moves MRR, or falls out of the window and moves Recall. The claim about "the same few
    documents" is false.

    The gate moved to the measured quantity: >= 6 queries diverging within the top three, the same
    number as the verdict rule's MIN_DISCORDANT, since this is a necessary condition for a
    discordant pair. Currently 8. The substantive-document count is still reported, but it no
    longer gates anything. See §6.3 and scripts/ko_eval_packb_disagreement.py.

    This does not promise power: if both arms find the gold, the position does not matter and the
    pair is a tie. "Underpowered" can still come back, and ADR-0009 keeps the obligation open when
    it does. What the gate buys is a reason to believe the label effort is worth spending.
  what: >
    Pack B's trigger counted documents but not whether a document could carry a query. The §6.1
    trigger (>= 100 active documents) was met on 2026-08-07 - the corpus reached 116 and the
    random-ranker floor fell to 10/116 = 0.086 - and the pack was frozen. Surveying it to author
    labels showed 19 documents with a body of 800 characters or more; the other 97 are revision-log
    rows whose length is mostly URLs. Forty answerable queries cannot be hung on nineteen documents
    without reusing golds across strata, which manufactures ties, and ties below six discordant
    pairs return "underpowered" - the one result ADR-0009 says does not discharge ADR-0008 §5(b).
  checked_by: human

- id: packb-result-disposition
  source: KOREAN_SEARCH_QUALITY.md §6.4
  owner: LivingLikeKrillin
  state: closed
  what: >
    Whether ADR-0008 §5(b) has fired. The condition reads "a Korean evaluation set exists that can
    compare tokenizers on Khala's real corpus, and its result does not favour mecab-ko". Pack B now
    exists, is verified against its manifest, passes the label gate, and was run on 2026-08-07:
    nori 4 wins, 2 losses, 34 ties over 40 answerable queries - six discordant pairs, exactly
    MIN_DISCORDANT, so the test returned p = 0.688 rather than "underpowered". Recall@10 was 0.975
    on both arms. Pack A's conclusion reproduced independently (p = 0.180 there).
  closed_by: >
    Ruled by the owner on 2026-08-07: §5(b) does NOT fire on this result. The condition asks for a
    result that fails to favour mecab-ko; what came back is an absence of difference. mecab-ko
    survives by rule 5 of the verdict procedure - keep the incumbent when the test cannot conclude
    - and an absence of difference is not grounds to unseat one.

    **This rules on the result, not on the condition.** §5(b) stays live: a later grader, or a
    larger or harder Pack B, could still produce a result that fails to favour mecab-ko. What is
    settled is that the 2026-08-07 run is not that result.

    Two limits travel with the ruling. Labels authored from the document side make queries easy -
    34 of 40 were ties and the discordant count cleared its floor by nothing, so one more tie and
    there would have been no p-value at all. And nothing detects a future firing of any §5
    backstop; that gap is carried separately by adr-0008-backstop-detector, which stays open.
  checked_by: human

- id: abstention-never-fires
  source: KOREAN_SEARCH_QUALITY.md §2.3
  owner: LivingLikeKrillin
  state: open
  what: >
    Abstention is now machine-readable (`abstained` / `abstain_reason` on the answer, exposed by the
    API) and the unanswerable labels can be scored for the first time. Measured on Pack B on
    2026-08-07: 0 of 5. The only condition that abstains is "no evidence at all", and BM25 returned
    a full window of ten for every unanswerable query, so the condition never fires.
  why_still_open: >
    The flag was the missing half; the policy is the other half and was deliberately not written.
    Making it fire needs a rule about when evidence is too weak to answer on - a threshold - and
    this repo set three unmeasured thresholds in a single day and had to remove all three. The
    number to build against now exists (0 of 5), which is what was missing before.

    Note what the measurement is not. It says the system answers when it should decline; it does not
    say the answers are wrong, since the LLM is separately instructed to say it cannot find the
    information. That instruction is narration and nothing checks it - which is the same shape as
    the defect just fixed.

    **2026-08-09: something else now waits on this.** The demand-pull gate for reading text out of
    screenshots (migration 011) needs a rate of "the answer was not available", and the only
    machine-readable proxy is this flag. Measured end to end the same day: asking for the per-avatar
    unlock thresholds - a fact that exists only inside an image - returned ten snippets, so
    `no_answer` was false and the gap signal counted zero, while the answer itself said the
    information could not be found. The numerator of that gate is therefore structurally zero until
    a deterministic "insufficient evidence" verdict exists.

    So this is no longer only a measurement gap. It gates ADR-0010 and
    SPEC-nexus-screenshot-text-extraction, both of which stay draft until the signal can move.
  trigger: >
    The first change to the answer path's evidence handling, or any approved SPEC or accepted ADR
    whose linked_adrs contains ADR-0002 (grounded answers only). Note that the answer path's
    evidence handling did change on 2026-08-08 - the prompt now receives whole chunks rather than
    300-character previews - and abstention still never fires, because the condition is still
    "no evidence at all" and retrieval always returns something.
  checked_by: human

- id: chunk-bound-is-estimator-tokens
  source: KOREAN_SEARCH_QUALITY.md §3.2
  owner: LivingLikeKrillin
  state: open
  what: >
    Chunk length is now bounded, but bounded in *estimator* tokens, and the estimator is words times
    a coefficient. It scores twenty thousand characters without a space as two tokens. The limit
    that actually bit - the embedding model's max_seq_length - is counted by a different tokenizer,
    so text without spaces can still exceed it and disappear from the vector leg exactly as before.
  why_still_open: >
    Closing it means either counting with the embedding model's own tokenizer at ingest, which
    couples the chunker to the embedding backend, or adding a character ceiling - and a character
    ceiling is a number nobody has measured. This repo set three unmeasured thresholds in a single
    day and removed all three, so it is named rather than guessed.

    It was firing when that sentence was written. On 2026-08-08 the largest chunk in the live
    corpus was 18,839 characters of which 18,623 (99%) were presigned S3 image URLs - no spaces, so
    the estimator scored the whole thing at 144 tokens against a 1100 bound, and the policy table
    inside it went to the prompt truncated. Three queries failed on it in every run.

    The cause was removed rather than the bound tightened: the Notion converter now keeps an
    image's caption and drops its URL, since Notion's links expire in an hour and are dead weight
    that also breaks chunking. Largest chunk 18,839 -> 3,794, chunks over 4k 6 -> 0, embedding
    coverage 288/289 -> 289/289.

    The blindness itself remains, and remains unmeasured: a different corpus with long space-free
    text would hit it again. What changed is that the one known producer of such text is gone.
  trigger: >
    A new row in embed_refusals whose reason names a sequence-length limit, or the first change to
    _estimate_tokens.
  checked_by: human

- id: image-gap-gate-not-yet-armed
  source: ADR-0002 gate form, recorded in migrations/011_image_gap_signal.sql
  owner: LivingLikeKrillin
  state: open
  what: >
    The observation mechanism for "policy locked inside screenshots" is half built. Documents now
    carry n_images (5 of 116 carry 44 images between them), search_log records how many
    image-bearing documents supplied the evidence for a query, and v_image_gap_signal reports a
    30-day rolling rate. What is missing is the numerator: the rate counts queries where
    `no_answer` is true, `no_answer` means "zero snippets", and BM25 always returns something.
    Measured on the day it shipped: the query whose answer lives only in an image scored
    no_answer = false and contributed nothing to the signal.
  why_still_open: >
    Fixing the numerator is `abstention-never-fires`, not this item - the two are the same missing
    piece seen from two directions, and doing it twice would produce two thresholds for one
    question. This row exists so the half-built mechanism is not mistaken for a working gate: a
    reader who queries v_image_gap_signal today gets 0.0000 and should not read that as "the
    problem is small".

    The threshold itself is deliberately unset. ADR-0002 requires it be set before observation, by
    the director, and setting it against a numerator known to be broken would repeat the mistake
    this repo made three times on 2026-08-07.
  trigger: >
    A deterministic insufficient-evidence verdict landing (see abstention-never-fires), or any
    approved SPEC or accepted ADR whose linked_adrs contains ADR-0002 and which relies on this
    signal.
  checked_by: human
