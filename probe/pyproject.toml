[project]
name = "khala-probe"
version = "0.1.0"
description = "Probe — mutation-driven test quality harness"
requires-python = ">=3.11"
dependencies = ["cosmic-ray>=8.3", "pyyaml>=6", "typer>=0.12"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
probe = "khala.probe.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
